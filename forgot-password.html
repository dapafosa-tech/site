<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відновлення пароля — Typebiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #0F1115;
            --ink-soft: #171A21;
            --ink-line: #2A2E38;
            --gold: #F2A93B;
            --teal: #46C9B8;
            --text-onink: #E7E4DA;
            --muted: #8B93A6;
            --radius: 10px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'IBM Plex Sans',sans-serif;
            background:var(--ink);
            color:var(--text-onink);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:2rem;
        }
        .reset-container{
            background:var(--ink-soft);
            border:1px solid var(--ink-line);
            border-radius:var(--radius);
            padding:3rem;
            max-width:420px;
            width:100%;
            box-shadow:0 30px 60px rgba(0,0,0,0.5);
        }
        .logo{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            font-weight:700;
            font-size:1.5rem;
            margin-bottom:2rem;
        }
        .logo .tab{
            width:30px;height:30px;
            border-radius:4px;
            background:var(--gold);
            color:var(--ink);
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:'IBM Plex Mono';
            font-size:0.75rem;
            font-weight:600;
            transform:rotate(-6deg);
        }
        h2{
            font-family:'Space Grotesk',sans-serif;
            font-size:1.5rem;
            text-align:center;
            margin-bottom:0.5rem;
        }
        .subtitle{
            text-align:center;
            color:var(--muted);
            margin-bottom:2rem;
            font-size:0.95rem;
        }
        .form-group{margin-bottom:1.5rem;}
        .form-label{
            display:block;
            font-weight:600;
            margin-bottom:0.4rem;
            font-size:0.85rem;
        }
        .form-control{
            width:100%;
            padding:0.75rem 1rem;
            background:var(--ink);
            border:1px solid var(--ink-line);
            border-radius:6px;
            color:var(--text-onink);
            font-family:'IBM Plex Sans',sans-serif;
            font-size:1rem;
            transition:border-color .2s;
        }
        .form-control:focus{outline:none;border-color:var(--gold);}
        .form-control::placeholder{color:var(--muted);}
        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            padding:0.75rem 1.5rem;
            border-radius:6px;
            font-weight:600;
            font-size:1rem;
            cursor:pointer;
            border:1px solid transparent;
            transition:transform .15s,box-shadow .15s;
            width:100%;
        }
        .btn-gold{
            background:var(--gold);
            color:var(--ink);
        }
        .btn-gold:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(242,169,59,0.28);
        }
        .btn:disabled{opacity:0.6;cursor:not-allowed;}
        .login-link{
            text-align:center;
            margin-top:1.5rem;
            color:var(--muted);
            font-size:0.9rem;
        }
        .login-link a{color:var(--teal);font-weight:600;}
        .login-link a:hover{color:var(--gold);}
        @media(max-width:480px){
            .reset-container{padding:2rem 1.5rem;}
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <span class="tab">Tb</span>
            <span>Typebiz</span>
        </div>

        <h2>Відновлення пароля</h2>
        <p class="subtitle">Введіть email, і ми надішлемо посилання для скидання пароля</p>

        <form id="resetForm">
            <div class="form-group">
                <label class="form-label" for="email">Електронна пошта</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <button type="submit" class="btn btn-gold btn-lg" id="resetBtn">
                <i class="fas fa-paper-plane"></i> Надіслати посилання
            </button>
        </form>

        <p class="login-link">
            <a href="/login"><i class="fas fa-arrow-left"></i> Повернутися до входу</a>
        </p>
    </div>

    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var email = document.getElementById('email').value;
            var submitBtn = document.getElementById('resetBtn');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Відправка...';

            var result = await auth.resetPassword(email);

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Надіслати посилання';

            if (result.success) {
                await showAlert('Посилання для скидання пароля надіслано на вашу пошту', 'success');
                setTimeout(function() {
                    window.location.href = '/login';
                }, 3000);
            } else {
                await showAlert(result.error, 'error');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Восстановление пароля — Typebiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 2rem;
        }

        .reset-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl);
            padding: 3rem;
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        .reset-container .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--gray-800);
        }

        .reset-container .logo i {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        .reset-container .logo span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .reset-container h2 {
            text-align: center;
            margin-bottom: 0.5rem;
        }

        .reset-container p.subtitle {
            text-align: center;
            color: var(--gray-500);
            margin-bottom: 2rem;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray-500);
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .reset-container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <i class="fas fa-cubes"></i>
            <span>Typebiz</span>
        </div>

        <h2>Восстановление пароля</h2>
        <p class="subtitle">Введите email, и мы отправим ссылку для сброса пароля</p>

        <form id="resetForm">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fas fa-paper-plane"></i> Отправить ссылку
            </button>
        </form>

        <p class="login-link">
            <a href="/login.html"><i class="fas fa-arrow-left"></i> Вернуться к входу</a>
        </p>
    </div>

    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        document.getElementById('resetForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const submitBtn = e.target.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Отправка...';

            const result = await auth.resetPassword(email);

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Отправить ссылку';

            if (result.success) {
                await showAlert('Ссылка для сброса пароля отправлена на вашу почту', 'success');
                setTimeout(() => {
                    window.location.href = '/login.html';
                }, 3000);
            } else {
                await showAlert(result.error, 'error');
            }
        });
    </script>
</body>
</html>

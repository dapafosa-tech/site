<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Відновлення пароля — Typebiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #0F1115;
            --ink-soft: #171A21;
            --ink-line: #2A2E38;
            --gold: #F2A93B;
            --teal: #46C9B8;
            --text-onink: #E7E4DA;
            --muted: #8B93A6;
            --radius: 10px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'IBM Plex Sans',sans-serif;
            background:var(--ink);
            color:var(--text-onink);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:2rem;
        }
        .reset-container{
            background:var(--ink-soft);
            border:1px solid var(--ink-line);
            border-radius:var(--radius);
            padding:3rem;
            max-width:420px;
            width:100%;
            box-shadow:0 30px 60px rgba(0,0,0,0.5);
        }
        .logo{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            font-weight:700;
            font-size:1.5rem;
            margin-bottom:2rem;
        }
        .logo .tab{
            width:30px;height:30px;
            border-radius:4px;
            background:var(--gold);
            color:var(--ink);
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:'IBM Plex Mono';
            font-size:0.75rem;
            font-weight:600;
            transform:rotate(-6deg);
        }
        h2{
            font-family:'Space Grotesk',sans-serif;
            font-size:1.5rem;
            text-align:center;
            margin-bottom:0.5rem;
        }
        .subtitle{
            text-align:center;
            color:var(--muted);
            margin-bottom:2rem;
            font-size:0.95rem;
        }
        .form-group{margin-bottom:1.5rem;}
        .form-label{
            display:block;
            font-weight:600;
            margin-bottom:0.4rem;
            font-size:0.85rem;
        }
        .form-control{
            width:100%;
            padding:0.75rem 1rem;
            background:var(--ink);
            border:1px solid var(--ink-line);
            border-radius:6px;
            color:var(--text-onink);
            font-family:'IBM Plex Sans',sans-serif;
            font-size:1rem;
            transition:border-color .2s;
        }
        .form-control:focus{outline:none;border-color:var(--gold);}
        .form-control::placeholder{color:var(--muted);}
        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            padding:0.75rem 1.5rem;
            border-radius:6px;
            font-weight:600;
            font-size:1rem;
            cursor:pointer;
            border:1px solid transparent;
            transition:transform .15s,box-shadow .15s;
            width:100%;
        }
        .btn-gold{
            background:var(--gold);
            color:var(--ink);
        }
        .btn-gold:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(242,169,59,0.28);
        }
        .btn:disabled{opacity:0.6;cursor:not-allowed;}
        .login-link{
            text-align:center;
            margin-top:1.5rem;
            color:var(--muted);
            font-size:0.9rem;
        }
        .login-link a{color:var(--teal);font-weight:600;}
        .login-link a:hover{color:var(--gold);}
        @media(max-width:480px){
            .reset-container{padding:2rem 1.5rem;}
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo">
            <span class="tab">Tb</span>
            <span>Typebiz</span>
        </div>

        <h2 id="resetTitle">Відновлення пароля</h2>
        <p class="subtitle" id="resetSubtitle">Введіть email, і ми надішлемо код для скидання пароля</p>

        <form id="resetForm">
            <div class="form-group">
                <label class="form-label" for="email">Електронна пошта</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <button type="submit" class="btn btn-gold btn-lg" id="resetBtn">
                <i class="fas fa-paper-plane"></i> Надіслати код
            </button>
        </form>

        <form id="otpForm" style="display:none;">
            <div class="form-group">
                <label class="form-label" for="resetCode">Код підтвердження</label>
                <input type="text" id="resetCode" class="form-control" placeholder="000000" maxlength="6" inputmode="numeric" autocomplete="one-time-code" style="text-align:center;letter-spacing:0.5em;font-size:1.3rem;font-family:'IBM Plex Mono',monospace;" required autofocus>
            </div>

            <button type="submit" class="btn btn-gold btn-lg" id="otpBtn">
                <i class="fas fa-check"></i> Підтвердити код
            </button>

            <p class="login-link">
                Не прийшов код? <a href="#" id="resetResendLink">Надіслати ще раз</a>
            </p>
        </form>

        <form id="newPasswordForm" style="display:none;">
            <div class="form-group">
                <label class="form-label" for="newPassword">Новий пароль</label>
                <input type="password" id="newPassword" class="form-control" placeholder="Мінімум 6 символів" minlength="6" required>
            </div>

            <button type="submit" class="btn btn-gold btn-lg" id="newPasswordBtn">
                <i class="fas fa-check"></i> Зберегти новий пароль
            </button>
        </form>

        <p class="login-link">
            <a href="/login"><i class="fas fa-arrow-left"></i> Повернутися до входу</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        var resetEmail = null;

        function goToStep(step) {
            document.getElementById('resetForm').style.display = step === 'email' ? 'block' : 'none';
            document.getElementById('otpForm').style.display = step === 'otp' ? 'block' : 'none';
            document.getElementById('newPasswordForm').style.display = step === 'password' ? 'block' : 'none';

            if (step === 'otp') {
                document.getElementById('resetTitle').textContent = 'Введіть код';
                document.getElementById('resetSubtitle').textContent = 'Ми надіслали 6-значний код на ' + resetEmail;
                document.getElementById('resetCode').focus();
            } else if (step === 'password') {
                document.getElementById('resetTitle').textContent = 'Новий пароль';
                document.getElementById('resetSubtitle').textContent = 'Введіть новий пароль для вашого акаунта';
                document.getElementById('newPassword').focus();
            }
        }

        document.getElementById('resetCode').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 6);
        });

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var email = document.getElementById('email').value.trim();
            var submitBtn = document.getElementById('resetBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Відправка...';

            try {
                await auth.requestPasswordReset(email);
                resetEmail = email;
                showToast('Якщо такий email існує - на нього надіслано код', 'success');
                goToStep('otp');
            } catch (error) {
                await showAlert(error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Надіслати код';
            }
        });

        document.getElementById('resetResendLink').addEventListener('click', async function(e) {
            e.preventDefault();
            if (!resetEmail) return;
            try {
                await auth.requestPasswordReset(resetEmail);
                showToast('Код надіслано повторно', 'success');
            } catch (error) {
                showToast('Помилка: ' + error.message, 'error');
            }
        });

        document.getElementById('otpForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var code = document.getElementById('resetCode').value.trim();
            var submitBtn = document.getElementById('otpBtn');

            if (code.length !== 6) {
                showToast('Введіть 6-значний код', 'warning');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Перевірка...';

            try {
                await auth.verifyPasswordResetOtp(resetEmail, code);
                goToStep('password');
            } catch (error) {
                await showAlert(error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check"></i> Підтвердити код';
            }
        });

        document.getElementById('newPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var newPassword = document.getElementById('newPassword').value;
            var submitBtn = document.getElementById('newPasswordBtn');

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Збереження...';

            try {
                await auth.updatePassword(newPassword);
                try { await window.sb.auth.signOut(); } catch (e) {}
                await showAlert('Пароль оновлено. Тепер увійдіть із новим паролем', 'success');
                setTimeout(function() {
                    window.location.href = '/login';
                }, 1200);
            } catch (error) {
                await showAlert(error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check"></i> Зберегти новий пароль';
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація — Typebiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #0F1115;
            --ink-soft: #171A21;
            --ink-line: #2A2E38;
            --gold: #F2A93B;
            --teal: #46C9B8;
            --text-onink: #E7E4DA;
            --muted: #8B93A6;
            --radius: 10px;
            --radius-sm: 6px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'IBM Plex Sans',sans-serif;
            background:var(--ink);
            color:var(--text-onink);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:2rem;
        }
        .register-container{
            background:var(--ink-soft);
            border:1px solid var(--ink-line);
            border-radius:var(--radius);
            padding:3rem;
            max-width:440px;
            width:100%;
            box-shadow:0 30px 60px rgba(0,0,0,0.5);
            max-height:95vh;
            overflow-y:auto;
        }
        .logo{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            font-weight:700;
            font-size:1.5rem;
            margin-bottom:2rem;
        }
        .logo .tab{
            width:30px;height:30px;
            border-radius:4px;
            background:var(--gold);
            color:var(--ink);
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:'IBM Plex Mono';
            font-size:0.75rem;
            font-weight:600;
            transform:rotate(-6deg);
        }
        h2{
            font-family:'Space Grotesk',sans-serif;
            font-size:1.5rem;
            text-align:center;
            margin-bottom:0.5rem;
        }
        .subtitle{
            text-align:center;
            color:var(--muted);
            margin-bottom:2rem;
            font-size:0.95rem;
        }
        .form-group{margin-bottom:1.5rem;}
        .form-label{
            display:block;
            font-weight:600;
            margin-bottom:0.4rem;
            font-size:0.85rem;
        }
        .form-control{
            width:100%;
            padding:0.75rem 1rem;
            background:var(--ink);
            border:1px solid var(--ink-line);
            border-radius:6px;
            color:var(--text-onink);
            font-family:'IBM Plex Sans',sans-serif;
            font-size:1rem;
            transition:border-color .2s;
        }
        .form-control:focus{outline:none;border-color:var(--gold);}
        .form-control::placeholder{color:var(--muted);}
        .password-toggle{position:relative;}
        .password-toggle .toggle-btn{
            position:absolute;
            right:1rem;
            top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            color:var(--muted);
            cursor:pointer;
            padding:0.25rem;
        }
        .password-toggle .toggle-btn:hover{color:var(--text-onink);}
        .password-hint{
            display:block;
            color:var(--muted);
            font-size:0.8rem;
            margin-top:0.25rem;
        }
        .terms-check{
            display:flex;
            align-items:flex-start;
            gap:0.5rem;
            font-size:0.9rem;
            color:var(--muted);
            cursor:pointer;
            margin-top:0.5rem;
        }
        .terms-check input[type="checkbox"]{
            margin-top:0.2rem;
            flex-shrink:0;
            width:18px;height:18px;
            accent-color:var(--gold);
            cursor:pointer;
        }
        .terms-check a{color:var(--teal);}
        .terms-check a:hover{color:var(--gold);}
        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            padding:0.75rem 1.5rem;
            border-radius:6px;
            font-weight:600;
            font-size:1rem;
            cursor:pointer;
            border:1px solid transparent;
            transition:transform .15s,box-shadow .15s;
            width:100%;
        }
        .btn-gold{
            background:var(--gold);
            color:var(--ink);
        }
        .btn-gold:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(242,169,59,0.28);
        }
        .btn:disabled{opacity:0.6;cursor:not-allowed;}
        .login-link{
            text-align:center;
            margin-top:1.5rem;
            color:var(--muted);
            font-size:0.9rem;
        }
        .login-link a{color:var(--teal);font-weight:600;}
        .login-link a:hover{color:var(--gold);}
        .avatar-upload{display:flex;flex-direction:column;align-items:center;margin-bottom:1.5rem;}
        .avatar-upload .avatar-preview{
            width:100px;height:100px;
            border-radius:50%;
            background:var(--ink);
            border:2px dashed var(--ink-line);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:3rem;
            color:var(--muted);
            cursor:pointer;
            transition:border-color .3s,background .3s;
            overflow:hidden;
            position:relative;
        }
        .avatar-upload .avatar-preview:hover{border-color:var(--gold);background:var(--ink-soft);}
        .avatar-upload .avatar-preview img{width:100%;height:100%;object-fit:cover;}
        .avatar-upload .avatar-preview .overlay{
            position:absolute;bottom:0;left:0;right:0;
            background:rgba(0,0,0,0.7);
            color:white;font-size:0.65rem;padding:0.2rem;
            text-align:center;opacity:0;
            transition:opacity .3s;
        }
        .avatar-upload .avatar-preview:hover .overlay{opacity:1;}
        .avatar-upload .avatar-hint{font-size:0.8rem;color:var(--muted);margin-top:0.5rem;}
        #avatarInput{display:none;}
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--ink-soft);
            border: 1px solid var(--ink-line);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            color: var(--text-onink);
            font-size: 0.9rem;
            max-width: 350px;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease;
            display: none;
        }
        .toast.show { display: block; }
        .toast.success { border-left: 4px solid var(--teal); }
        .toast.error { border-left: 4px solid #E2503E; }
        .toast.warning { border-left: 4px solid var(--gold); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @media(max-width:480px){
            .register-container{padding:2rem 1.5rem;}
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    
    <div class="register-container">
        <div class="logo">
            <span class="tab">Tb</span>
            <span class="brand-name">Typebiz</span>
        </div>

        <h2>Створити акаунт</h2>
        <p class="subtitle">Почніть керувати своєю організацією</p>

        <form id="registerForm" autocomplete="off" novalidate>
            <div class="avatar-upload">
                <div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('avatarInput').click()">
                    <i class="fas fa-user"></i>
                    <div class="overlay">Змінити фото</div>
                </div>
                <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(event)">
                <span class="avatar-hint">Натисніть на аватар, щоб завантажити фото</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="fullName">Повне ім'я</label>
                <input type="text" id="fullName" class="form-control" placeholder="Іван Іванов" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Електронна пошта</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <div class="password-toggle">
                    <input type="password" id="password" class="form-control" placeholder="Мінімум 6 символів" required minlength="6">
                    <button type="button" class="toggle-btn" onclick="togglePassword('password')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <span class="password-hint">Пароль має містити мінімум 6 символів</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Підтвердіть пароль</label>
                <div class="password-toggle">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Повторіть пароль" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="terms-check">
                    <input type="checkbox" id="terms" required>
                    <span>
                        Я погоджуюся з <a href="/terms" target="_blank">умовами використання</a>
                        та <a href="/privacy" target="_blank">політикою конфіденційності</a>
                    </span>
                </label>
            </div>

            <button type="submit" class="btn btn-gold" id="registerBtn">
                <i class="fas fa-user-plus"></i> Створити акаунт
            </button>
        </form>

        <p class="login-link">
            Уже є акаунт? <a href="/login">Увійти</a>
        </p>
    </div>

    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/check-auth.js"></script>
    <script>
        var selectedAvatarFile = null;
        var toastTimeout = null;

        function showToast(message, type) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + (type || '');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(function() {
                toast.classList.remove('show');
            }, 5000);
        }

        function previewAvatar(event) {
            var file = event.target.files[0];
            if (!file) return;

            var maxSizeBytes = 5 * 1024 * 1024;
            if (file.size > maxSizeBytes) {
                showToast('Файл занадто великий. Оберіть зображення до 5 МБ.', 'warning');
                event.target.value = '';
                return;
            }

            var reader = new FileReader();
            reader.onload = function(e) {
                var preview = document.getElementById('avatarPreview');
                preview.innerHTML = 
                    '<img src="' + e.target.result + '" alt="Аватар">' +
                    '<div class="overlay">Змінити фото</div>';
                selectedAvatarFile = file;
            };
            reader.readAsDataURL(file);
        }

        function togglePassword(inputId) {
            var input = document.getElementById(inputId);
            var icon = input.parentElement.querySelector('.toggle-btn i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        document.getElementById('password').addEventListener('input', function() {
            var confirmInput = document.getElementById('confirmPassword');
            if (confirmInput.value && confirmInput.value !== this.value) {
                confirmInput.style.borderColor = '#E2503E';
            } else if (confirmInput.value) {
                confirmInput.style.borderColor = '#46C9B8';
            }
        });

        document.getElementById('confirmPassword').addEventListener('input', function() {
            var passwordInput = document.getElementById('password');
            if (this.value && this.value !== passwordInput.value) {
                this.style.borderColor = '#E2503E';
            } else if (this.value) {
                this.style.borderColor = '#46C9B8';
            } else {
                this.style.borderColor = '';
            }
        });

        // ============================================
        // ЗАВАНТАЖЕННЯ АВАТАРА В SUPABASE STORAGE
        // ============================================

        async function ensureBucketExists() {
            try {
                var checkResponse = await fetch(SUPABASE_URL + '/storage/v1/bucket/avatars', {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                    }
                });
                
                if (checkResponse.status === 404) {
                    var createResponse = await fetch(SUPABASE_URL + '/storage/v1/bucket', {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            id: 'avatars',
                            name: 'avatars',
                            public: true
                        })
                    });
                    
                    if (!createResponse.ok) {
                        console.error('Failed to create bucket');
                        return false;
                    }
                }
                return true;
            } catch (e) {
                console.error('Bucket check error:', e);
                return false;
            }
        }

        async function uploadAvatarToBucket(userId, file) {
            try {
                var ext = file.name.split('.').pop().toLowerCase();
                var fileName = userId + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.' + ext;
                var uploadUrl = SUPABASE_URL + '/storage/v1/object/avatars/' + fileName;

                var uploadResponse = await fetch(uploadUrl, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
                        'Content-Type': file.type || 'application/octet-stream'
                    },
                    body: file
                });

                if (!uploadResponse.ok) {
                    var errText = await uploadResponse.text();
                    console.error('Avatar upload failed:', uploadResponse.status, errText);
                    return null;
                }

                return SUPABASE_URL + '/storage/v1/object/public/avatars/' + fileName;
            } catch (e) {
                console.error('Avatar upload error:', e);
                return null;
            }
        }

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var fullName = document.getElementById('fullName').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var terms = document.getElementById('terms').checked;
            var submitBtn = document.getElementById('registerBtn');

            if (!fullName) {
                showToast('Введіть ваше ім\'я', 'warning');
                return;
            }

            if (!email) {
                showToast('Введіть електронну пошту', 'warning');
                return;
            }

            if (password.length < 6) {
                showToast('Пароль має бути мінімум 6 символів', 'warning');
                return;
            }

            if (password !== confirmPassword) {
                showToast('Паролі не співпадають!', 'error');
                return;
            }

            if (!terms) {
                showToast('Прийміть умови використання', 'warning');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Створення...';

            try {
                // 1. Створюємо акаунт
                var result = await auth.registerUser(email, password, fullName);
                
                if (!result.success) {
                    throw new Error(result.error);
                }

                var user = result.user;

                // 2. Якщо є аватарка - завантажуємо
                if (selectedAvatarFile) {
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Завантаження фото...';
                    
                    try {
                        await ensureBucketExists();
                        var avatarUrl = await uploadAvatarToBucket(user.id, selectedAvatarFile);
                        
                        if (avatarUrl) {
                            // Оновлюємо URL в БД
                            await db.updateUser(user.id, { avatar_url: avatarUrl });
                            
                            // Оновлюємо в localStorage
                            user.avatar_url = avatarUrl;
                            localStorage.setItem('userData', JSON.stringify(user));
                        }
                    } catch (avatarError) {
                        console.error('Avatar upload error:', avatarError);
                        showToast('Акаунт створено, але не вдалося завантажити аватар.', 'warning');
                    }
                }

                showToast('Акаунт успішно створено!', 'success');
                
                // 3. Редірект після всього
                setTimeout(function() {
                    window.location.href = '/dashboard';
                }, 1500);

            } catch (error) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Створити акаунт';
                showToast('Помилка: ' + error.message, 'error');
            }
        });
    </script>
</body>
</html>

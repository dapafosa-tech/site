<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Typebiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 2rem;
        }

        .register-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl);
            padding: 3rem;
            max-width: 440px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        .register-container .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--gray-800);
        }

        .register-container .logo i {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        .register-container .logo span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--gray-800);
        }

        .register-container p.subtitle {
            text-align: center;
            color: var(--gray-500);
            margin-bottom: 2rem;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray-500);
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            padding: 0.5rem;
        }

        .password-toggle .toggle-btn:hover {
            color: var(--gray-600);
        }

        .password-hint {
            display: block;
            color: var(--gray-500);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--gray-600);
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .terms-check input[type="checkbox"] {
            margin-top: 0.25rem;
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .terms-check a {
            color: var(--primary);
            text-decoration: none;
        }

        .terms-check a:hover {
            text-decoration: underline;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <i class="fas fa-cubes"></i>
            <span>Typebiz</span>
        </div>

        <h2>Создать аккаунт</h2>
        <p class="subtitle">Начните управлять своей организацией</p>

        <form id="registerForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label class="form-label" for="fullName">Полное имя</label>
                <input type="text" id="fullName" class="form-control" placeholder="Иван Иванов" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <div class="password-toggle">
                    <input type="password" id="password" class="form-control" placeholder="Минимум 6 символов" required minlength="6">
                    <button type="button" class="toggle-btn" onclick="togglePassword('password')" aria-label="Показать/скрыть пароль">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <span class="password-hint">Пароль должен содержать минимум 6 символов</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Подтвердите пароль</label>
                <div class="password-toggle">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Повторите пароль" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword')" aria-label="Показать/скрыть пароль">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="terms-check">
                    <input type="checkbox" id="terms" required>
                    <span>
                        Я согласен с <a href="/terms.html" target="_blank">условиями использования</a>
                        и <a href="/privacy.html" target="_blank">политикой конфиденциальности</a>
                    </span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
                <i class="fas fa-user-plus"></i> Создать аккаунт
            </button>
        </form>

        <p class="login-link">
            Уже есть аккаунт? <a href="/login.html">Войти</a>
        </p>
    </div>

    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.toggle-btn i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // Валидация пароля в реальном времени
        document.getElementById('password').addEventListener('input', function() {
            const confirmInput = document.getElementById('confirmPassword');
            if (confirmInput.value && confirmInput.value !== this.value) {
                confirmInput.style.borderColor = 'var(--danger)';
            } else if (confirmInput.value) {
                confirmInput.style.borderColor = 'var(--success)';
            }
        });

        document.getElementById('confirmPassword').addEventListener('input', function() {
            const passwordInput = document.getElementById('password');
            if (this.value && this.value !== passwordInput.value) {
                this.style.borderColor = 'var(--danger)';
            } else if (this.value) {
                this.style.borderColor = 'var(--success)';
            } else {
                this.style.borderColor = '';
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            const submitBtn = document.getElementById('registerBtn');

            // Валидация
            if (!fullName) {
                await showAlert('Пожалуйста, введите ваше имя', 'warning');
                return;
            }

            if (!email) {
                await showAlert('Пожалуйста, введите email', 'warning');
                return;
            }

            if (password.length < 6) {
                await showAlert('Пароль должен содержать минимум 6 символов', 'warning');
                return;
            }

            if (password !== confirmPassword) {
                await showAlert('Пароли не совпадают!', 'error');
                return;
            }

            if (!terms) {
                await showAlert('Пожалуйста, примите условия использования', 'warning');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Создание...';

            const result = await auth.registerUser(email, password, fullName);

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Создать аккаунт';

            if (!result.success) {
                await showAlert(result.error, 'error');
                return;
            }

            await showToast('Аккаунт создан! Добро пожаловать в Typebiz! 🎉', 'success');
            
            // Небольшая задержка перед редиректом
            setTimeout(() => {
                window.location.href = '/dashboard.html';
            }, 1500);
        });

        // Проверка авторизации — если уже залогинен, редирект
        (async () => {
            const isAuth = await auth.checkAuth();
            if (isAuth) {
                window.location.href = '/dashboard.html';
            }
        })();
    </script>
</body>
</html>

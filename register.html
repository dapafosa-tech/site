<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Typebiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 2rem;
        }

        .register-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl);
            padding: 3rem;
            max-width: 440px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        .register-container .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--gray-800);
        }

        .register-container .logo i {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        .register-container .logo span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--gray-800);
        }

        .register-container p.subtitle {
            text-align: center;
            color: var(--gray-500);
            margin-bottom: 2rem;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray-500);
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            padding: 0.5rem;
        }

        .password-toggle .toggle-btn:hover {
            color: var(--gray-600);
        }

        .password-hint {
            display: block;
            color: var(--gray-500);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--gray-600);
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .terms-check input[type="checkbox"] {
            margin-top: 0.25rem;
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .terms-check a {
            color: var(--primary);
            text-decoration: none;
        }

        .terms-check a:hover {
            text-decoration: underline;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #debugLog {
            margin-top: 1rem;
            padding: 0.75rem;
            background: #1a202c;
            color: #68d391;
            border-radius: var(--radius-sm);
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            max-height: 200px;
            overflow-y: auto;
            display: none;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #debugLog.show {
            display: block;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <i class="fas fa-cubes"></i>
            <span>Typebiz</span>
        </div>

        <h2>Создать аккаунт</h2>
        <p class="subtitle">Начните управлять своей организацией</p>

        <form id="registerForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label class="form-label" for="fullName">Полное имя</label>
                <input type="text" id="fullName" class="form-control" placeholder="Иван Иванов" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <div class="password-toggle">
                    <input type="password" id="password" class="form-control" placeholder="Минимум 6 символов" required minlength="6">
                    <button type="button" class="toggle-btn" onclick="togglePassword('password')" aria-label="Показать/скрыть пароль">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <span class="password-hint">Пароль должен содержать минимум 6 символов</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Подтвердите пароль</label>
                <div class="password-toggle">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Повторите пароль" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword')" aria-label="Показать/скрыть пароль">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="terms-check">
                    <input type="checkbox" id="terms" required>
                    <span>
                        Я согласен с <a href="/terms.html" target="_blank">условиями использования</a>
                        и <a href="/privacy.html" target="_blank">политикой конфиденциальности</a>
                    </span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
                <i class="fas fa-user-plus"></i> Создать аккаунт
            </button>
        </form>

        <p class="login-link">
            Уже есть аккаунт? <a href="/login.html">Войти</a>
        </p>

        <div id="debugLog"></div>
    </div>

    <script>
        // ============================================
        // TYPEBIZ - РЕГИСТРАЦИЯ (ИСПРАВЛЕННАЯ)
        // ============================================

        const SUPABASE_URL = 'https://iazzgxacdwhaxujoxtaz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhenpneGFjZHdoYXh1am94dGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTY3MDIsImV4cCI6MjEwMTM3MjcwMn0.quXjQ6575ACSjxnfa-hKkD6u3KMYE_5ZLdtqS4JKXI0';

        let debugLog = document.getElementById('debugLog');

        function logDebug(message, data = null) {
            debugLog.classList.add('show');
            const timestamp = new Date().toLocaleTimeString();
            let line = `[${timestamp}] ${message}`;
            if (data) {
                line += '\n' + JSON.stringify(data, null, 2);
            }
            debugLog.textContent += line + '\n---\n';
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(message, data || '');
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.toggle-btn i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // Валидация пароля в реальном времени
        document.getElementById('password').addEventListener('input', function() {
            const confirmInput = document.getElementById('confirmPassword');
            if (confirmInput.value && confirmInput.value !== this.value) {
                confirmInput.style.borderColor = 'var(--danger)';
            } else if (confirmInput.value) {
                confirmInput.style.borderColor = 'var(--success)';
            }
        });

        document.getElementById('confirmPassword').addEventListener('input', function() {
            const passwordInput = document.getElementById('password');
            if (this.value && this.value !== passwordInput.value) {
                this.style.borderColor = 'var(--danger)';
            } else if (this.value) {
                this.style.borderColor = 'var(--success)';
            } else {
                this.style.borderColor = '';
            }
        });

        // ===== ОСНОВНАЯ ФУНКЦИЯ РЕГИСТРАЦИИ =====

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            logDebug('🚀 Начало регистрации');

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            const submitBtn = document.getElementById('registerBtn');

            logDebug('📝 Данные формы:', { fullName, email, password: '***', confirmPassword: '***', terms });

            // Валидация
            if (!fullName) {
                logDebug('❌ Ошибка: пустое имя');
                await showAlert('Пожалуйста, введите ваше имя', 'warning');
                return;
            }

            if (!email) {
                logDebug('❌ Ошибка: пустой email');
                await showAlert('Пожалуйста, введите email', 'warning');
                return;
            }

            if (!email.includes('@')) {
                logDebug('❌ Ошибка: неверный email');
                await showAlert('Введите корректный email', 'warning');
                return;
            }

            if (password.length < 6) {
                logDebug('❌ Ошибка: короткий пароль');
                await showAlert('Пароль должен содержать минимум 6 символов', 'warning');
                return;
            }

            if (password !== confirmPassword) {
                logDebug('❌ Ошибка: пароли не совпадают');
                await showAlert('Пароли не совпадают!', 'error');
                return;
            }

            if (!terms) {
                logDebug('❌ Ошибка: не приняты условия');
                await showAlert('Пожалуйста, примите условия использования', 'warning');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Создание...';

            try {
                // ===== ШАГ 1: Регистрация в Supabase Auth =====
                logDebug('📡 Шаг 1: Регистрация в Supabase Auth');

                const authResponse = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                logDebug(`📡 Auth ответ: статус ${authResponse.status}`);

                const authData = await authResponse.json();
                logDebug('📡 Auth данные:', authData);

                if (!authResponse.ok) {
                    throw new Error(authData.message || 'Ошибка регистрации в Auth');
                }

                // ⚠️ ИСПРАВЛЕНИЕ: проверяем наличие id напрямую, а не user.id
                const userId = authData.id || authData.user?.id;
                
                if (!userId) {
                    logDebug('❌ Нет ID пользователя в ответе');
                    throw new Error('Пользователь не создан в Auth');
                }

                logDebug(`✅ Пользователь создан в Auth: ${userId}`);

                // ===== ШАГ 2: Создание профиля в таблице users =====
                logDebug('📡 Шаг 2: Создание профиля в таблице users');

                const profileData = {
                    auth_id: userId,
                    email: authData.email || email,
                    full_name: fullName || 'Пользователь',
                    role: 'user',
                    is_active: true
                };

                logDebug('📝 Профиль:', profileData);

                const profileResponse = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(profileData)
                });

                logDebug(`📡 Профиль ответ: статус ${profileResponse.status}`);

                if (!profileResponse.ok) {
                    const errorText = await profileResponse.text();
                    logDebug('❌ Ошибка создания профиля:', errorText);
                    
                    // Если профиль не создался, но пользователь уже есть в Auth —
                    // пробуем обновить существующий профиль
                    if (profileResponse.status === 409) {
                        logDebug('⚠️ Профиль уже существует, пробуем обновить');
                        const updateResponse = await fetch(`${SUPABASE_URL}/rest/v1/users?auth_id=eq.${userId}`, {
                            method: 'PATCH',
                            headers: {
                                'apikey': SUPABASE_ANON_KEY,
                                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({ full_name: fullName })
                        });
                        
                        if (!updateResponse.ok) {
                            throw new Error('Не удалось обновить профиль');
                        }
                        logDebug('✅ Профиль обновлен');
                    } else {
                        throw new Error(`Не удалось создать профиль: ${errorText}`);
                    }
                } else {
                    const profileResult = await profileResponse.json();
                    logDebug('✅ Профиль создан:', profileResult);
                }

                // ===== ШАГ 3: Сохранение сессии =====
                if (authData.session) {
                    logDebug('📡 Шаг 3: Сохранение сессии');
                    localStorage.setItem('supabase_session', JSON.stringify(authData.session));
                    logDebug('✅ Сессия сохранена');
                } else {
                    logDebug('⚠️ Сессия не получена, пробуем войти автоматически');
                    // Пробуем войти
                    const loginResponse = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ email, password })
                    });
                    
                    if (loginResponse.ok) {
                        const loginData = await loginResponse.json();
                        if (loginData.session) {
                            localStorage.setItem('supabase_session', JSON.stringify(loginData.session));
                            logDebug('✅ Сессия получена через вход');
                        }
                    }
                }

                // ===== УСПЕХ =====
                logDebug('🎉 РЕГИСТРАЦИЯ УСПЕШНА!');

                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Создать аккаунт';

                await showToast('Аккаунт создан! Добро пожаловать в Typebiz! 🎉', 'success');
                
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1500);

            } catch (error) {
                logDebug('❌ КРИТИЧЕСКАЯ ОШИБКА:', error.message);
                console.error('Полная ошибка:', error);

                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Создать аккаунт';

                await showAlert('Ошибка: ' + error.message, 'error');
            }
        });

        // ===== ИМПОРТ UI ФУНКЦИЙ =====

        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer') || createToastContainer();
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon ${type}">
                    <i class="fas ${icons[type] || icons.info}"></i>
                </span>
                <span class="toast-message">${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        function showAlert(message, type = 'info', title = '') {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay active';

                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };

                const titles = {
                    success: 'Успешно!',
                    error: 'Ошибка!',
                    warning: 'Внимание!',
                    info: 'Информация'
                };

                overlay.innerHTML = `
                    <div class="modal-box">
                        <div class="modal-icon ${type}">
                            <i class="fas ${icons[type] || icons.info}"></i>
                        </div>
                        <h3>${title || titles[type] || 'Информация'}</h3>
                        <p>${message}</p>
                        <div class="modal-buttons">
                            <button class="btn btn-primary" id="alertOkBtn">OK</button>
                        </div>
                    </div>
                `;

                document.body.appendChild(overlay);
                
                const okBtn = overlay.querySelector('#alertOkBtn');
                okBtn.addEventListener('click', () => {
                    overlay.remove();
                    resolve(true);
                });

                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.remove();
                        resolve(true);
                    }
                });

                setTimeout(() => okBtn.focus(), 100);
            });
        }

        // Проверка авторизации
        (async () => {
            try {
                const session = localStorage.getItem('supabase_session');
                if (session) {
                    const sessionData = JSON.parse(session);
                    const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${sessionData.access_token}`
                        }
                    });
                    if (response.ok) {
                        window.location.href = '/dashboard.html';
                    }
                }
            } catch (e) {
                console.log('Не авторизован');
            }
        })();

        logDebug('🔧 Страница загружена, ждем действий');
    </script>
</body>
</html>

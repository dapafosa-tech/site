<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Typebiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 2rem;
        }

        .register-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl);
            padding: 3rem;
            max-width: 440px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        .register-container .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--gray-800);
        }

        .register-container .logo i {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        .register-container .logo span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--gray-800);
        }

        .register-container p.subtitle {
            text-align: center;
            color: var(--gray-500);
            margin-bottom: 2rem;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray-500);
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            padding: 0.5rem;
        }

        .password-toggle .toggle-btn:hover {
            color: var(--gray-600);
        }

        .password-hint {
            display: block;
            color: var(--gray-500);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--gray-600);
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .terms-check input[type="checkbox"] {
            margin-top: 0.25rem;
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .terms-check a {
            color: var(--primary);
            text-decoration: none;
        }

        .terms-check a:hover {
            text-decoration: underline;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <i class="fas fa-cubes"></i>
            <span>Typebiz</span>
        </div>

        <h2>Создать аккаунт</h2>
        <p class="subtitle">Начните управлять своей организацией</p>

        <form id="registerForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label class="form-label" for="fullName">Полное имя</label>
                <input type="text" id="fullName" class="form-control" placeholder="Иван Иванов" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <div class="password-toggle">
                    <input type="password" id="password" class="form-control" placeholder="Минимум 6 символов" required minlength="6">
                    <button type="button" class="toggle-btn" onclick="togglePassword('password')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <span class="password-hint">Пароль должен содержать минимум 6 символов</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Подтвердите пароль</label>
                <div class="password-toggle">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Повторите пароль" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="terms-check">
                    <input type="checkbox" id="terms" required>
                    <span>
                        Я согласен с <a href="/terms.html" target="_blank">условиями использования</a>
                    </span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
                <i class="fas fa-user-plus"></i> Создать аккаунт
            </button>
        </form>

        <p class="login-link">
            Уже есть аккаунт? <a href="/login.html">Войти</a>
        </p>
    </div>

    <script>
        // ============================================
        // TYPEBIZ - РЕГИСТРАЦИЯ БЕЗ AUTH
        // ПРОСТО ВСТАВКА В ТАБЛИЦУ users
        // ============================================

        const SUPABASE_URL = 'https://iazzgxacdwhaxujoxtaz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhenpneGFjZHdoYXh1am94dGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTY3MDIsImV4cCI6MjEwMTM3MjcwMn0.quXjQ6575ACSjxnfa-hKkD6u3KMYE_5ZLdtqS4JKXI0';

        // ===== ГЕНЕРАТОР UUID =====
        function generateUUID() {
            return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
                var r = Math.random() * 16 | 0,
                    v = c == 'x' ? r : (r & 0x3 | 0x8);
                return v.toString(16);
            });
        }

        // ===== UI ФУНКЦИИ =====

        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer') || createToastContainer();
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon ${type}">
                    <i class="fas ${icons[type] || icons.info}"></i>
                </span>
                <span class="toast-message">${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        function showAlert(message, type = 'info', title = '') {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay active';

                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };

                const titles = {
                    success: 'Успешно!',
                    error: 'Ошибка!',
                    warning: 'Внимание!',
                    info: 'Информация'
                };

                overlay.innerHTML = `
                    <div class="modal-box">
                        <div class="modal-icon ${type}">
                            <i class="fas ${icons[type] || icons.info}"></i>
                        </div>
                        <h3>${title || titles[type] || 'Информация'}</h3>
                        <p>${message}</p>
                        <div class="modal-buttons">
                            <button class="btn btn-primary" id="alertOkBtn">OK</button>
                        </div>
                    </div>
                `;

                document.body.appendChild(overlay);
                
                const okBtn = overlay.querySelector('#alertOkBtn');
                okBtn.addEventListener('click', () => {
                    overlay.remove();
                    resolve(true);
                });

                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.remove();
                        resolve(true);
                    }
                });

                setTimeout(() => okBtn.focus(), 100);
            });
        }

        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.toggle-btn i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ===== РЕГИСТРАЦИЯ =====

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            const submitBtn = document.getElementById('registerBtn');

            // ===== ВАЛИДАЦИЯ =====
            if (!fullName) {
                await showAlert('Введите ваше имя', 'warning');
                return;
            }

            if (!email) {
                await showAlert('Введите email', 'warning');
                return;
            }

            if (password.length < 6) {
                await showAlert('Пароль должен быть минимум 6 символов', 'warning');
                return;
            }

            if (password !== confirmPassword) {
                await showAlert('Пароли не совпадают!', 'error');
                return;
            }

            if (!terms) {
                await showAlert('Примите условия использования', 'warning');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Создание...';

            try {
                // ===== ПРОВЕРКА: ЕСТЬ ЛИ ТАКОЙ EMAIL =====
                const checkResponse = await fetch(`${SUPABASE_URL}/rest/v1/users?email=eq.${encodeURIComponent(email)}`, {
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                    }
                });

                if (checkResponse.ok) {
                    const existing = await checkResponse.json();
                    if (existing && existing.length > 0) {
                        await showAlert('Пользователь с таким email уже существует', 'warning');
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Создать аккаунт';
                        return;
                    }
                }

                // ===== СОЗДАЁМ ПОЛЬЗОВАТЕЛЯ =====
                const userId = generateUUID();
                
                const userData = {
                    id: userId,
                    auth_id: userId,
                    email: email,
                    full_name: fullName,
                    role: 'user',
                    is_active: true,
                    created_at: new Date().toISOString()
                };

                console.log('📡 Создаём пользователя:', userData);

                const response = await fetch(`${SUPABASE_URL}/rest/v1/users`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=representation'
                    },
                    body: JSON.stringify(userData)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    console.error('Ошибка:', errorText);
                    throw new Error('Ошибка при создании аккаунта');
                }

                const result = await response.json();
                console.log('✅ Пользователь создан:', result);

                // ===== СОХРАНЯЕМ В LOCALSTORAGE =====
                localStorage.setItem('userData', JSON.stringify(result[0] || result));
                localStorage.setItem('isGuest', 'false');

                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Создать аккаунт';

                await showToast('Аккаунт создан! 🎉', 'success');
                
                setTimeout(() => {
                    window.location.href = '/dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('❌ Ошибка:', error);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Создать аккаунт';
                await showAlert(error.message, 'error');
            }
        });

        // ===== ПРОВЕРКА: УЖЕ ЗАЛОГИНЕН =====
        (async () => {
            try {
                const userData = localStorage.getItem('userData');
                if (userData) {
                    const user = JSON.parse(userData);
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/users?email=eq.${encodeURIComponent(user.email)}`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.length > 0) {
                            window.location.href = '/dashboard.html';
                        }
                    }
                }
            } catch (e) {
                console.log('Не авторизован');
            }
        })();
    </script>
</body>
</html>

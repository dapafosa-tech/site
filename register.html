<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — Typebiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 2rem;
        }

        .register-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl);
            padding: 3rem;
            max-width: 440px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        .register-container .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--gray-800);
        }

        .register-container .logo i {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        .register-container .logo span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .register-container h2 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--gray-800);
        }

        .register-container p.subtitle {
            text-align: center;
            color: var(--gray-500);
            margin-bottom: 2rem;
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray-500);
        }

        .login-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            padding: 0.5rem;
        }

        .password-toggle .toggle-btn:hover {
            color: var(--gray-600);
        }

        .password-hint {
            display: block;
            color: var(--gray-500);
            font-size: 0.85rem;
            margin-top: 0.25rem;
        }

        .terms-check {
            display: flex;
            align-items: flex-start;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--gray-600);
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .terms-check input[type="checkbox"] {
            margin-top: 0.25rem;
            flex-shrink: 0;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .terms-check a {
            color: var(--primary);
            text-decoration: none;
        }

        .terms-check a:hover {
            text-decoration: underline;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-block {
            width: 100%;
            justify-content: center;
        }

        /* Стили для аватарки */
        .avatar-upload {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .avatar-upload .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--gray-500);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px dashed var(--gray-300);
            overflow: hidden;
            position: relative;
        }

        .avatar-upload .avatar-preview:hover {
            border-color: var(--primary);
            background: var(--gray-100);
        }

        .avatar-upload .avatar-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-upload .avatar-preview .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.6);
            color: white;
            font-size: 0.7rem;
            padding: 0.25rem;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .avatar-upload .avatar-preview:hover .overlay {
            opacity: 1;
        }

        .avatar-upload .avatar-hint {
            font-size: 0.8rem;
            color: var(--gray-500);
            margin-top: 0.5rem;
        }

        #avatarInput {
            display: none;
        }

        @media (max-width: 480px) {
            .register-container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <i class="fas fa-cubes"></i>
            <span>Typebiz</span>
        </div>

        <h2>Создать аккаунт</h2>
        <p class="subtitle">Начните управлять своей организацией</p>

        <form id="registerForm" autocomplete="off" novalidate>
            <!-- АВАТАРКА -->
            <div class="avatar-upload">
                <div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('avatarInput').click()">
                    <i class="fas fa-user"></i>
                    <div class="overlay">Изменить фото</div>
                </div>
                <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(event)">
                <span class="avatar-hint">Нажмите на аватар, чтобы загрузить фото</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="fullName">Полное имя</label>
                <input type="text" id="fullName" class="form-control" placeholder="Иван Иванов" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <div class="password-toggle">
                    <input type="password" id="password" class="form-control" placeholder="Минимум 6 символов" required minlength="6">
                    <button type="button" class="toggle-btn" onclick="togglePassword('password')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <span class="password-hint">Пароль должен содержать минимум 6 символов</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Подтвердите пароль</label>
                <div class="password-toggle">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Повторите пароль" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="terms-check">
                    <input type="checkbox" id="terms" required>
                    <span>
                        Я согласен с <a href="/terms" target="_blank">условиями использования</a>
                        и <a href="/privacy" target="_blank">политикой конфиденциальности</a>
                    </span>
                </label>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="registerBtn">
                <i class="fas fa-user-plus"></i> Создать аккаунт
            </button>
        </form>

        <p class="login-link">
            Уже есть аккаунт? <a href="/login">Войти</a>
        </p>
    </div>

    <script src="/js/db.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        // ============================================
        // TYPEBIZ - РЕГИСТРАЦИЯ С АВАТАРКОЙ
        // ============================================

        let selectedAvatarFile = null;

        // ===== ПРЕВЬЮ АВАТАРКИ =====
        function previewAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('avatarPreview');
                preview.innerHTML = `
                    <img src="${e.target.result}" alt="Avatar">
                    <div class="overlay">Изменить фото</div>
                `;
                selectedAvatarFile = file;
            };
            reader.readAsDataURL(file);
        }

        // ===== ПЕРЕКЛЮЧЕНИЕ ПАРОЛЯ =====
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const icon = input.parentElement.querySelector('.toggle-btn i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ===== ВАЛИДАЦИЯ ПАРОЛЯ =====
        document.getElementById('password').addEventListener('input', function() {
            const confirmInput = document.getElementById('confirmPassword');
            if (confirmInput.value && confirmInput.value !== this.value) {
                confirmInput.style.borderColor = 'var(--danger)';
            } else if (confirmInput.value) {
                confirmInput.style.borderColor = 'var(--success)';
            }
        });

        document.getElementById('confirmPassword').addEventListener('input', function() {
            const passwordInput = document.getElementById('password');
            if (this.value && this.value !== passwordInput.value) {
                this.style.borderColor = 'var(--danger)';
            } else if (this.value) {
                this.style.borderColor = 'var(--success)';
            } else {
                this.style.borderColor = '';
            }
        });

        // ===== РЕГИСТРАЦИЯ =====
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            const submitBtn = document.getElementById('registerBtn');

            if (!fullName) {
                await showAlert('Введите ваше имя', 'warning');
                return;
            }

            if (!email) {
                await showAlert('Введите email', 'warning');
                return;
            }

            if (password.length < 6) {
                await showAlert('Пароль должен быть минимум 6 символов', 'warning');
                return;
            }

            if (password !== confirmPassword) {
                await showAlert('Пароли не совпадают!', 'error');
                return;
            }

            if (!terms) {
                await showAlert('Примите условия использования', 'warning');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Создание...';

            try {
                // Регистрация
                const result = await auth.registerUser(email, password, fullName);
                
                if (!result.success) {
                    throw new Error(result.error);
                }

                // Загрузка аватарки если есть
                if (selectedAvatarFile) {
                    try {
                        await storage.uploadAvatar(selectedAvatarFile);
                        await showToast('Аватарка загружена!', 'success');
                    } catch (avatarError) {
                        console.warn('Avatar upload error:', avatarError);
                        // Не критично, продолжаем
                    }
                }

                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Создать аккаунт';

                await showToast('Аккаунт создан! Добро пожаловать в Typebiz! 🎉', 'success');
                
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1500);

            } catch (error) {
                console.error('Registration error:', error);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Создать аккаунт';
                await showAlert('Ошибка: ' + error.message, 'error');
            }
        });

        // Проверка авторизации
        (async () => {
            try {
                const userData = localStorage.getItem('userData');
                if (userData) {
                    const user = JSON.parse(userData);
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/users?email=eq.${encodeURIComponent(user.email)}`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data && data.length > 0) {
                            window.location.href = '/dashboard';
                        }
                    }
                }
            } catch (e) {
                console.log('Не авторизован');
            }
        })();
    </script>
</body>
</html>

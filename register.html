<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Реєстрація — Typebiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #0F1115;
            --ink-soft: #171A21;
            --ink-line: #2A2E38;
            --gold: #F2A93B;
            --teal: #46C9B8;
            --text-onink: #E7E4DA;
            --muted: #8B93A6;
            --radius: 10px;
            --radius-sm: 6px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'IBM Plex Sans',sans-serif;
            background:var(--ink);
            color:var(--text-onink);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:2rem;
        }
        .register-container{
            background:var(--ink-soft);
            border:1px solid var(--ink-line);
            border-radius:var(--radius);
            padding:3rem;
            max-width:440px;
            width:100%;
            box-shadow:0 30px 60px rgba(0,0,0,0.5);
            max-height:95vh;
            overflow-y:auto;
        }
        .logo{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            font-weight:700;
            font-size:1.5rem;
            margin-bottom:2rem;
        }
        .logo .tab{
            width:30px;height:30px;
            border-radius:4px;
            background:var(--gold);
            color:var(--ink);
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:'IBM Plex Mono';
            font-size:0.75rem;
            font-weight:600;
            transform:rotate(-6deg);
        }
        h2{
            font-family:'Space Grotesk',sans-serif;
            font-size:1.5rem;
            text-align:center;
            margin-bottom:0.5rem;
        }
        .subtitle{
            text-align:center;
            color:var(--muted);
            margin-bottom:2rem;
            font-size:0.95rem;
        }
        .form-group{margin-bottom:1.5rem;}
        .form-label{
            display:block;
            font-weight:600;
            margin-bottom:0.4rem;
            font-size:0.85rem;
        }
        .form-control{
            width:100%;
            padding:0.75rem 1rem;
            background:var(--ink);
            border:1px solid var(--ink-line);
            border-radius:6px;
            color:var(--text-onink);
            font-family:'IBM Plex Sans',sans-serif;
            font-size:1rem;
            transition:border-color .2s;
        }
        .form-control:focus{outline:none;border-color:var(--gold);}
        .form-control::placeholder{color:var(--muted);}
        .form-control:disabled{opacity:0.5;cursor:not-allowed;}
        .password-toggle{position:relative;}
        .password-toggle .toggle-btn{
            position:absolute;
            right:1rem;
            top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            color:var(--muted);
            cursor:pointer;
            padding:0.25rem;
        }
        .password-toggle .toggle-btn:hover{color:var(--text-onink);}
        .password-hint{
            display:block;
            color:var(--muted);
            font-size:0.8rem;
            margin-top:0.25rem;
        }
        .terms-check{
            display:flex;
            align-items:flex-start;
            gap:0.5rem;
            font-size:0.9rem;
            color:var(--muted);
            cursor:pointer;
            margin-top:0.5rem;
        }
        .terms-check input[type="checkbox"]{
            margin-top:0.2rem;
            flex-shrink:0;
            width:18px;height:18px;
            accent-color:var(--gold);
            cursor:pointer;
        }
        .terms-check a{color:var(--teal);}
        .terms-check a:hover{color:var(--gold);}
        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            padding:0.75rem 1.5rem;
            border-radius:6px;
            font-weight:600;
            font-size:1rem;
            cursor:pointer;
            border:1px solid transparent;
            transition:transform .15s,box-shadow .15s;
            width:100%;
        }
        .btn-gold{
            background:var(--gold);
            color:var(--ink);
        }
        .btn-gold:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(242,169,59,0.28);
        }
        .btn-teal{
            background:var(--teal);
            color:var(--ink);
        }
        .btn-teal:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(70,201,184,0.28);
        }
        .btn:disabled{opacity:0.6;cursor:not-allowed;}
        .btn-sm{padding:0.4rem 1rem;font-size:0.85rem;width:auto;}
        .login-link{
            text-align:center;
            margin-top:1.5rem;
            color:var(--muted);
            font-size:0.9rem;
        }
        .login-link a{color:var(--teal);font-weight:600;}
        .login-link a:hover{color:var(--gold);}
        .avatar-upload{display:flex;flex-direction:column;align-items:center;margin-bottom:1.5rem;}
        .avatar-upload .avatar-preview{
            width:100px;height:100px;
            border-radius:50%;
            background:var(--ink);
            border:2px dashed var(--ink-line);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:3rem;
            color:var(--muted);
            cursor:pointer;
            transition:border-color .3s,background .3s;
            overflow:hidden;
            position:relative;
        }
        .avatar-upload .avatar-preview:hover{border-color:var(--gold);background:var(--ink-soft);}
        .avatar-upload .avatar-preview img{width:100%;height:100%;object-fit:cover;}
        .avatar-upload .avatar-preview .overlay{
            position:absolute;bottom:0;left:0;right:0;
            background:rgba(0,0,0,0.7);
            color:white;font-size:0.65rem;padding:0.2rem;
            text-align:center;opacity:0;
            transition:opacity .3s;
        }
        .avatar-upload .avatar-preview:hover .overlay{opacity:1;}
        .avatar-upload .avatar-hint{font-size:0.8rem;color:var(--muted);margin-top:0.5rem;}
        #avatarInput{display:none;}
        .email-row{display:flex;gap:0.5rem;align-items:center;}
        .email-row .form-control{flex:1;}
        .email-row .btn{width:auto;padding:0.6rem 1rem;font-size:0.85rem;white-space:nowrap;}
        .code-row{display:flex;gap:0.5rem;align-items:center;margin-top:0.5rem;}
        .code-row .form-control{flex:1;font-family:monospace;font-size:1.2rem;letter-spacing:4px;text-align:center;}
        .code-row .btn{width:auto;padding:0.6rem 1rem;font-size:0.85rem;white-space:nowrap;}
        .email-status{
            display:block;
            margin-top:0.25rem;
            font-size:0.8rem;
            color:var(--muted);
        }
        .email-status.success{color:var(--teal);}
        .email-status.error{color:#E2503E;}
        .email-status.info{color:var(--gold);}
        @media(max-width:480px){
            .register-container{padding:2rem 1.5rem;}
            .email-row{flex-direction:column;}
            .email-row .btn{width:100%;}
            .code-row{flex-direction:column;}
            .code-row .btn{width:100%;}
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="logo">
            <span class="tab">Tb</span>
            <span>Typebiz</span>
        </div>

        <h2>Створити акаунт</h2>
        <p class="subtitle">Почніть керувати своєю організацією</p>

        <form id="registerForm" autocomplete="off" novalidate>
            <!-- АВАТАРКА -->
            <div class="avatar-upload">
                <div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('avatarInput').click()">
                    <i class="fas fa-user"></i>
                    <div class="overlay">Змінити фото</div>
                </div>
                <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(event)">
                <span class="avatar-hint">Натисніть на аватар, щоб завантажити фото</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="fullName">Повне ім'я</label>
                <input type="text" id="fullName" class="form-control" placeholder="Іван Іванов" required autofocus>
            </div>

            <!-- EMAIL З ВЕРИФІКАЦІЄЮ -->
            <div class="form-group">
                <label class="form-label" for="email">Електронна пошта</label>
                <div class="email-row">
                    <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
                    <button type="button" class="btn btn-teal" id="sendCodeBtn" onclick="sendCode()">
                        <i class="fas fa-paper-plane"></i> Код
                    </button>
                </div>
                <div class="code-row" id="codeRow" style="display:none;">
                    <input type="text" id="verificationCode" class="form-control" placeholder="Код" maxlength="6" autocomplete="off">
                    <button type="button" class="btn btn-gold" id="verifyBtn" onclick="verifyCode()">
                        <i class="fas fa-check"></i> Підтвердити
                    </button>
                </div>
                <span class="email-status" id="emailStatus">Введіть email і натисніть "Код"</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <div class="password-toggle">
                    <input type="password" id="password" class="form-control" placeholder="Мінімум 6 символів" required minlength="6">
                    <button type="button" class="toggle-btn" onclick="togglePassword('password')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
                <span class="password-hint">Пароль має містити мінімум 6 символів</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="confirmPassword">Підтвердіть пароль</label>
                <div class="password-toggle">
                    <input type="password" id="confirmPassword" class="form-control" placeholder="Повторіть пароль" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword('confirmPassword')">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label class="terms-check">
                    <input type="checkbox" id="terms" required>
                    <span>
                        Я погоджуюся з <a href="/terms" target="_blank">умовами використання</a>
                        та <a href="/privacy" target="_blank">політикою конфіденційності</a>
                    </span>
                </label>
            </div>

            <button type="submit" class="btn btn-gold" id="registerBtn" disabled>
                <i class="fas fa-user-plus"></i> Створити акаунт
            </button>
        </form>

        <p class="login-link">
            Уже є акаунт? <a href="/login">Увійти</a>
        </p>
    </div>

    <script src="/js/db.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        var selectedAvatarFile = null;
        var isEmailVerified = false;
        var currentEmail = '';

        function previewAvatar(event) {
            var file = event.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                var preview = document.getElementById('avatarPreview');
                preview.innerHTML = 
                    '<img src="' + e.target.result + '" alt="Аватар">' +
                    '<div class="overlay">Змінити фото</div>';
                selectedAvatarFile = file;
            };
            reader.readAsDataURL(file);
        }

        function togglePassword(inputId) {
            var input = document.getElementById(inputId);
            var icon = input.parentElement.querySelector('.toggle-btn i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        function updateEmailStatus(message, type) {
            var status = document.getElementById('emailStatus');
            status.textContent = message;
            status.className = 'email-status ' + type;
        }

        // ===== ВІДПРАВКА КОДУ =====
        async function sendCode() {
            var email = document.getElementById('email').value.trim();
            var sendBtn = document.getElementById('sendCodeBtn');

            if (!email) {
                await showAlert('Введіть електронну пошту', 'warning');
                return;
            }

            // Проста перевірка email
            if (!email.includes('@') || !email.includes('.')) {
                await showAlert('Введіть коректну електронну пошту', 'warning');
                return;
            }

            currentEmail = email;
            sendBtn.disabled = true;
            sendBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                var result = await auth.sendVerificationCode(email);
                
                if (!result.success) {
                    throw new Error(result.error);
                }

                document.getElementById('codeRow').style.display = 'flex';
                updateEmailStatus('✅ Код надіслано на вашу пошту! Перевірте спам.', 'success');
                document.getElementById('verificationCode').focus();
                
                await showToast('Код підтвердження надіслано на email! 📨', 'success');

            } catch (error) {
                console.error('Send code error:', error);
                updateEmailStatus('❌ ' + error.message, 'error');
                await showAlert('Помилка: ' + error.message, 'error');
            }

            sendBtn.disabled = false;
            sendBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Код';
        }

        // ===== ПЕРЕВІРКА КОДУ =====
        async function verifyCode() {
            var code = document.getElementById('verificationCode').value.trim();
            var verifyBtn = document.getElementById('verifyBtn');

            if (!code || code.length < 6) {
                await showAlert('Введіть 6-значний код', 'warning');
                return;
            }

            if (!currentEmail) {
                await showAlert('Спочатку надішліть код', 'warning');
                return;
            }

            verifyBtn.disabled = true;
            verifyBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                var result = await auth.verifyEmailCode(currentEmail, code);
                
                if (!result.success) {
                    throw new Error(result.error);
                }

                isEmailVerified = true;
                document.getElementById('codeRow').style.display = 'none';
                updateEmailStatus('✅ Email підтверджено! 🎉', 'success');
                document.getElementById('registerBtn').disabled = false;
                document.getElementById('sendCodeBtn').disabled = true;
                document.getElementById('email').disabled = true;
                document.getElementById('verificationCode').disabled = true;
                document.getElementById('verifyBtn').disabled = true;

                await showToast('Email підтверджено! Тепер ви можете створити акаунт.', 'success');

            } catch (error) {
                console.error('Verify code error:', error);
                updateEmailStatus('❌ ' + error.message, 'error');
                await showAlert('Помилка: ' + error.message, 'error');
                document.getElementById('verificationCode').value = '';
                document.getElementById('verificationCode').focus();
            }

            verifyBtn.disabled = false;
            verifyBtn.innerHTML = '<i class="fas fa-check"></i> Підтвердити';
        }

        // Валідація пароля
        document.getElementById('password').addEventListener('input', function() {
            var confirmInput = document.getElementById('confirmPassword');
            if (confirmInput.value && confirmInput.value !== this.value) {
                confirmInput.style.borderColor = '#E2503E';
            } else if (confirmInput.value) {
                confirmInput.style.borderColor = '#46C9B8';
            }
        });

        document.getElementById('confirmPassword').addEventListener('input', function() {
            var passwordInput = document.getElementById('password');
            if (this.value && this.value !== passwordInput.value) {
                this.style.borderColor = '#E2503E';
            } else if (this.value) {
                this.style.borderColor = '#46C9B8';
            } else {
                this.style.borderColor = '';
            }
        });

        // ===== РЕЄСТРАЦІЯ =====
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var fullName = document.getElementById('fullName').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var confirmPassword = document.getElementById('confirmPassword').value;
            var terms = document.getElementById('terms').checked;
            var submitBtn = document.getElementById('registerBtn');

            if (!fullName) {
                await showAlert('Введіть ваше ім\'я', 'warning');
                return;
            }

            if (!email) {
                await showAlert('Введіть електронну пошту', 'warning');
                return;
            }

            if (!isEmailVerified) {
                await showAlert('Підтвердіть електронну пошту', 'warning');
                return;
            }

            if (password.length < 6) {
                await showAlert('Пароль має бути мінімум 6 символів', 'warning');
                return;
            }

            if (password !== confirmPassword) {
                await showAlert('Паролі не співпадають!', 'error');
                return;
            }

            if (!terms) {
                await showAlert('Прийміть умови використання', 'warning');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Створення...';

            try {
                var result = await auth.registerUser(email, password, fullName);
                
                if (!result.success) {
                    throw new Error(result.error);
                }

                if (selectedAvatarFile) {
                    try {
                        await storage.uploadAvatar(selectedAvatarFile);
                    } catch (avatarError) {
                        console.warn('Avatar upload error:', avatarError);
                    }
                }

                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Створити акаунт';

                await showToast('Акаунт створено! Ласкаво просимо до Typebiz! 🎉', 'success');
                
                setTimeout(function() {
                    window.location.href = '/dashboard';
                }, 1500);

            } catch (error) {
                console.error('Registration error:', error);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Створити акаунт';
                await showAlert('Помилка: ' + error.message, 'error');
            }
        });

        // Перевірка авторизації
        (async function() {
            try {
                var userData = localStorage.getItem('userData');
                if (userData) {
                    var user = JSON.parse(userData);
                    var response = await fetch(SUPABASE_URL + '/rest/v1/users?email=eq.' + encodeURIComponent(user.email), {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
                        }
                    });
                    
                    if (response.ok) {
                        var data = await response.json();
                        if (data && data.length > 0) {
                            window.location.href = '/dashboard';
                        }
                    }
                }
            } catch (e) {
                console.log('Не авторизовано');
            }
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель — OrgSpace</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background: var(--gray-50);
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100%;
            background: white;
            border-right: 1px solid var(--gray-200);
            padding: 1.5rem;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sidebar .logo i {
            color: var(--primary);
        }

        .sidebar .logo span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sidebar .user-info {
            padding: 1rem;
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .sidebar .user-info .name {
            font-weight: 600;
            font-size: 0.95rem;
        }

        .sidebar .user-info .email {
            font-size: 0.8rem;
            color: var(--gray-500);
        }

        .sidebar .nav-menu {
            list-style: none;
        }

        .sidebar .nav-menu li {
            margin-bottom: 0.25rem;
        }

        .sidebar .nav-menu a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            color: var(--gray-600);
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
            cursor: pointer;
        }

        .sidebar .nav-menu a:hover {
            background: var(--gray-50);
            color: var(--primary);
        }

        .sidebar .nav-menu a.active {
            background: var(--primary);
            color: white;
        }

        .sidebar .nav-menu a i {
            width: 20px;
            text-align: center;
        }

        .main-content {
            margin-left: 260px;
            padding: 2rem;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .page-header h1 {
            font-size: 2rem;
            font-weight: 700;
        }

        .page-header p {
            color: var(--gray-500);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .stat-card .stat-label {
            color: var(--gray-500);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .admin-section {
            background: white;
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }

        .admin-section .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .admin-section h2 {
            font-size: 1.25rem;
        }

        .admin-badge {
            background: var(--danger);
            color: white;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .main-content {
                margin-left: 0;
                padding: 1rem;
            }

            .page-header h1 {
                font-size: 1.5rem;
            }

            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <i class="fas fa-cubes"></i>
            <span>OrgSpace</span>
        </div>

        <div class="user-info" id="userInfo">
            <div class="avatar avatar-sm" id="userAvatar">A</div>
            <div>
                <div class="name" id="userName">Администратор</div>
                <div class="email" id="userEmail">admin@orgspace.com</div>
            </div>
        </div>

        <ul class="nav-menu">
            <li><a href="/dashboard.html"><i class="fas fa-arrow-left"></i> Назад в дашборд</a></li>
            <li><a href="#" class="active"><i class="fas fa-crown"></i> Админ-панель</a></li>
            <li><a href="#" onclick="loadSection('users')"><i class="fas fa-users"></i> Пользователи</a></li>
            <li><a href="#" onclick="loadSection('orgs')"><i class="fas fa-building"></i> Организации</a></li>
            <li><a href="#" onclick="loadSection('logs')"><i class="fas fa-history"></i> Логи</a></li>
            <li><a href="#" onclick="handleLogout()"><i class="fas fa-sign-out-alt"></i> Выйти</a></li>
        </ul>
    </aside>

    <main class="main-content" id="mainContent">
        <div class="page-header">
            <div>
                <h1>Административная панель</h1>
                <p>Управление системой и пользователями</p>
            </div>
            <span class="admin-badge"><i class="fas fa-shield-alt"></i> Админ</span>
        </div>

        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">Пользователей</div>
            </div>
            <div class="stat-card" style="border-color: var(--success);">
                <div class="stat-value" id="totalOrgs">0</div>
                <div class="stat-label">Организаций</div>
            </div>
            <div class="stat-card" style="border-color: var(--warning);">
                <div class="stat-value" id="totalEmployees">0</div>
                <div class="stat-label">Сотрудников</div>
            </div>
            <div class="stat-card" style="border-color: var(--secondary);">
                <div class="stat-value" id="totalDocuments">0</div>
                <div class="stat-label">Документов</div>
            </div>
        </div>

        <div id="adminContent">
            <div class="admin-section">
                <div class="section-header">
                    <h2>Последние действия</h2>
                </div>
                <div id="recentLogs">
                    <p class="text-muted">Загрузка...</p>
                </div>
            </div>
        </div>
    </main>

    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>

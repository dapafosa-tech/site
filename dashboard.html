<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Організація — Typebiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background: var(--paper);
        }

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100%;
            background: var(--ink);
            border-right: 1px solid var(--ink-line);
            padding: 1.5rem;
            overflow-y: auto;
            z-index: 100;
        }

        .sidebar .logo {
            font-family: var(--font-display);
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-onink);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }

        .sidebar .logo i { color: var(--gold); }
        .sidebar .logo span { color: var(--text-onink); }

        .sidebar .org-info {
            padding: 1rem;
            background: var(--ink-soft);
            border: 1px solid var(--ink-line);
            border-radius: var(--radius-sm);
            margin-bottom: 2rem;
        }

        .sidebar .org-info .org-name {
            font-weight: 600;
            font-size: 1rem;
            color: var(--text-onink);
        }

        .sidebar .org-info .org-type {
            font-size: 0.8rem;
            color: var(--muted-onink);
        }

        .sidebar .org-info .org-code {
            font-size: 0.8rem;
            color: var(--muted-onink);
            margin-top: 0.25rem;
            font-family: var(--font-mono);
        }

        .sidebar .nav-menu {
            list-style: none;
        }

        .sidebar .nav-menu li { margin-bottom: 0.25rem; }
        .sidebar .nav-menu a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            color: var(--muted-onink);
            text-decoration: none;
            transition: all 0.2s ease;
            font-weight: 500;
            font-size: 0.92rem;
            cursor: pointer;
        }

        .sidebar .nav-menu a:hover { background: var(--ink-soft); color: var(--text-onink); }
        .sidebar .nav-menu a.active { background: var(--gold); color: var(--ink); font-weight: 600; }
        .sidebar .nav-menu a i { width: 20px; text-align: center; color: var(--teal); }
        .sidebar .nav-menu a.active i { color: var(--ink); }

        .mobile-topbar { display: none; }
        .sidebar-overlay { display: none; }

        @media (max-width: 900px) {
            .mobile-topbar {
                display: flex; align-items: center; justify-content: space-between;
                position: fixed; top: 0; left: 0; right: 0; height: 56px;
                background: var(--ink); color: var(--text-onink); padding: 0 1rem; z-index: 300;
            }
            .mobile-topbar .hamburger { background: none; border: none; color: var(--text-onink); font-size: 1.3rem; cursor: pointer; }
            .sidebar { transform: translateX(-100%); transition: transform .25s ease; z-index: 400; }
            .sidebar.open { transform: translateX(0); }
            .sidebar-overlay.active { display: block; position: fixed; inset: 0; background: rgba(15,17,21,0.5); z-index: 350; }
            .main-content { margin-left: 0 !important; padding-top: 4.5rem !important; }
        }

        .main-content {
            margin-left: 260px;
            padding: 2rem;
            min-height: 100vh;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h1 { font-size: 2rem; font-weight: 700; }
        .page-header p { color: var(--gray-500); }

        .back-link {
            color: var(--primary);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .back-link:hover { text-decoration: underline; }

        .section-content { animation: fadeIn 0.3s ease; }

        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border-left: 4px solid var(--primary);
        }

        .stat-card .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gray-900);
        }

        .stat-card .stat-label {
            color: var(--gray-500);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .badge-pending { background: #fef3c7; color: #92400e; }
        .badge-approved { background: #d1fae5; color: #065f46; }
        .badge-rejected { background: #fee2e2; color: #991b1b; }

        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
        }

        .empty-state i {
            font-size: 3rem;
            color: var(--gray-300);
            margin-bottom: 1rem;
        }

        .empty-state p {
            color: var(--gray-500);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }

        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlideIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray-500);
        }

        .modal-close:hover { color: var(--gray-700); }

        .color-picker {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .color-picker .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .color-picker .color-option:hover { transform: scale(1.1); }
        .color-picker .color-option.selected { border-color: var(--primary); }

        .btn-sm {
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 1rem; }
            .page-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="mobile-topbar">
        <button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open'); document.querySelector('.sidebar-overlay').classList.toggle('active');"><i class="fas fa-bars"></i></button>
        <span style="font-family: var(--font-display); font-weight:700; color:var(--text-onink);">Typebiz</span>
        <span></span>
    </div>
    <div class="sidebar-overlay" onclick="this.classList.remove('active'); document.querySelector('.sidebar').classList.remove('open');"></div>

    <aside class="sidebar">
        <a href="/dashboard" class="logo">
            <i class="fas fa-cubes"></i>
            <span>Typebiz</span>
        </a>

        <div class="org-info" id="orgInfo">
            <div class="org-name" id="orgName">Завантаження...</div>
            <div class="org-type" id="orgType">---</div>
            <div class="org-code" id="orgCode"><i class="fas fa-key"></i> Код: <span id="joinCode">---</span></div>
        </div>

        <ul class="nav-menu">
            <li><a href="/dashboard"><i class="fas fa-arrow-left"></i> Назад</a></li>
            <li><a class="active" onclick="loadSection('overview')"><i class="fas fa-th-large"></i> Огляд</a></li>
            <li><a onclick="loadSection('members')"><i class="fas fa-users"></i> Учасники</a></li>
            <li><a onclick="loadSection('requests')"><i class="fas fa-inbox"></i> Заявки</a></li>
            <li><a onclick="loadSection('ranks')"><i class="fas fa-crown"></i> Посади</a></li>
            <li><a onclick="loadSection('departments')"><i class="fas fa-sitemap"></i> Відділи</a></li>
            <li><a onclick="loadSection('settings')"><i class="fas fa-cog"></i> Налаштування</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <a href="/dashboard" class="back-link">
            <i class="fas fa-arrow-left"></i> До моїх організацій
        </a>

        <div class="page-header">
            <div>
                <h1 id="pageTitle">Огляд</h1>
                <p id="pageSubtitle">Керування організацією</p>
            </div>
        </div>

        <div id="sectionContent" class="section-content">
            <div class="text-center text-muted">Завантаження...</div>
        </div>
    </main>

    <!-- Модалка створення посади -->
    <div class="modal" id="rankModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="rankModalTitle">Створити посаду</h2>
                <button class="modal-close" onclick="closeModal('rankModal')">&times;</button>
            </div>
            <form id="rankForm">
                <input type="hidden" id="rankEditId">
                <div class="form-group">
                    <label class="form-label">Назва посади</label>
                    <input type="text" class="form-control" id="rankName" placeholder="Наприклад: Менеджер" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Колір</label>
                    <div class="color-picker" id="colorPicker">
                        <div class="color-option selected" style="background:#4f46e5" onclick="selectColor(this)"></div>
                        <div class="color-option" style="background:#ef4444" onclick="selectColor(this)"></div>
                        <div class="color-option" style="background:#f59e0b" onclick="selectColor(this)"></div>
                        <div class="color-option" style="background:#10b981" onclick="selectColor(this)"></div>
                        <div class="color-option" style="background:#3b82f6" onclick="selectColor(this)"></div>
                        <div class="color-option" style="background:#8b5cf6" onclick="selectColor(this)"></div>
                        <div class="color-option" style="background:#ec4899" onclick="selectColor(this)"></div>
                        <div class="color-option" style="background:#14b8a6" onclick="selectColor(this)"></div>
                    </div>
                    <input type="hidden" id="rankColor" value="#4f46e5">
                </div>
                <div class="form-group">
                    <label class="form-label">Права</label>
                    <div style="display:flex;flex-wrap:wrap;gap:0.75rem;margin-top:0.5rem;">
                        <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;">
                            <input type="checkbox" class="rank-permission" value="all"> Все права
                        </label>
                        <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;">
                            <input type="checkbox" class="rank-permission" value="manage"> Керування
                        </label>
                        <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;">
                            <input type="checkbox" class="rank-permission" value="moderate"> Модерація
                        </label>
                        <label style="display:flex;align-items:center;gap:0.5rem;font-size:0.9rem;">
                            <input type="checkbox" class="rank-permission" value="view"> Перегляд
                        </label>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> <span id="rankSubmitText">Створити</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Модалка створення відділу -->
    <div class="modal" id="departmentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Створити відділ</h2>
                <button class="modal-close" onclick="closeModal('departmentModal')">&times;</button>
            </div>
            <form id="departmentForm">
                <div class="form-group">
                    <label class="form-label">Назва відділу</label>
                    <input type="text" class="form-control" id="deptName" placeholder="Наприклад: Відділ продажів" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Опис</label>
                    <textarea class="form-control" id="deptDesc" rows="3" placeholder="Опис відділу"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> Створити відділ
                </button>
            </form>
        </div>
    </div>

    <!-- Модалка призначення посади -->
    <div class="modal" id="assignRankModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Призначити посаду</h2>
                <button class="modal-close" onclick="closeModal('assignRankModal')">&times;</button>
            </div>
            <form id="assignRankForm">
                <input type="hidden" id="assignMemberId">
                <div class="form-group">
                    <label class="form-label">Користувач</label>
                    <input type="text" class="form-control" id="assignUserName" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Посада</label>
                    <select class="form-control" id="assignRankSelect" required>
                        <option value="">Оберіть посаду...</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> Призначити
                </button>
            </form>
        </div>
    </div>

    <!-- Модалка призначення у відділ -->
    <div class="modal" id="assignEmployeeModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Призначити працівника у відділ</h2>
                <button class="modal-close" onclick="closeModal('assignEmployeeModal')">&times;</button>
            </div>
            <form id="assignEmployeeForm">
                <input type="hidden" id="assignDeptId">
                <div class="form-group">
                    <label class="form-label">Відділ</label>
                    <input type="text" class="form-control" id="assignDeptName" disabled>
                </div>
                <div class="form-group">
                    <label class="form-label">Працівник</label>
                    <select class="form-control" id="assignEmployeeSelect" required>
                        <option value="">Оберіть працівника...</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-save"></i> Призначити
                </button>
            </form>
        </div>
    </div>

    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/org-dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дашборд — Typebiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body { background: var(--gray-50); }
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 260px;
            height: 100%;
            background: white;
            border-right: 1px solid var(--gray-200);
            padding: 1.5rem;
            overflow-y: auto;
            z-index: 100;
        }
        .sidebar .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--gray-800);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
        }
        .sidebar .logo i { color: var(--primary); }
        .sidebar .logo span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .sidebar .user-info {
            padding: 1rem;
            background: var(--gray-50);
            border-radius: var(--radius-sm);
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .sidebar .user-info .name { font-weight: 600; font-size: 0.95rem; }
        .sidebar .user-info .email { font-size: 0.8rem; color: var(--gray-500); }
        .sidebar .nav-menu { list-style: none; }
        .sidebar .nav-menu li { margin-bottom: 0.25rem; }
        .sidebar .nav-menu a {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem 1rem;
            border-radius: var(--radius-sm);
            color: var(--gray-600);
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 500;
            cursor: pointer;
        }
        .sidebar .nav-menu a:hover { background: var(--gray-50); color: var(--primary); }
        .sidebar .nav-menu a.active { background: var(--primary); color: white; }
        .sidebar .nav-menu a i { width: 20px; text-align: center; }
        .sidebar .nav-menu .logout-btn {
            margin-top: 2rem;
            border-top: 1px solid var(--gray-200);
            padding-top: 1rem;
        }
        .sidebar .nav-menu .logout-btn a { color: var(--danger); cursor: pointer; }
        .sidebar .nav-menu .logout-btn a:hover { background: #fef2f2; }
        .main-content { margin-left: 260px; padding: 2rem; min-height: 100vh; }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .page-header h1 { font-size: 2rem; font-weight: 700; }
        .page-header p { color: var(--gray-500); }
        .org-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-top: 1.5rem;
        }
        .org-card {
            background: white;
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-200);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .org-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-4px); }
        .org-card .org-icon {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .org-card .org-icon.shop { background: #dbeafe; color: #2563eb; }
        .org-card .org-icon.library { background: #d1fae5; color: #059669; }
        .org-card .org-icon.company { background: #fef3c7; color: #d97706; }
        .org-card .org-icon.other { background: #f3e8ff; color: #7c3aed; }
        .org-card h3 { font-size: 1.1rem; margin-bottom: 0.25rem; }
        .org-card p { color: var(--gray-500); font-size: 0.9rem; }
        .org-card .org-type {
            display: inline-block;
            padding: 0.2rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            background: var(--gray-100);
            color: var(--gray-600);
            margin-top: 0.5rem;
        }
        .create-org-card {
            border: 2px dashed var(--gray-300);
            background: transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .create-org-card:hover { border-color: var(--primary); background: rgba(79, 70, 229, 0.05); }
        .create-org-card i { font-size: 3rem; color: var(--gray-400); margin-bottom: 1rem; }
        .create-org-card h4 { color: var(--gray-600); }
        .empty-state { text-align: center; padding: 4rem 2rem; }
        .empty-state i { font-size: 4rem; color: var(--gray-300); margin-bottom: 1rem; }
        .empty-state h3 { margin-bottom: 0.5rem; }
        .empty-state p { color: var(--gray-500); max-width: 400px; margin: 0 auto 1.5rem; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
        }
        .modal.active { display: flex; }
        .modal-content {
            background: white;
            border-radius: var(--radius);
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalSlideIn 0.3s ease;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--gray-500);
            transition: color 0.3s ease;
        }
        .modal-close:hover { color: var(--gray-700); }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main-content { margin-left: 0; padding: 1rem; }
            .page-header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <a href="/dashboard" class="logo">
            <i class="fas fa-cubes"></i>
            <span>Typebiz</span>
        </a>
        <div class="user-info">
            <div class="avatar avatar-sm" id="userAvatar">U</div>
            <div>
                <div class="name" id="userName">Загрузка...</div>
                <div class="email" id="userEmail">---</div>
            </div>
        </div>
        <ul class="nav-menu">
            <li><a href="/dashboard" class="active"><i class="fas fa-th-large"></i> Мои организации</a></li>
            <li id="adminLink" style="display:none;"><a href="/admin"><i class="fas fa-crown"></i> Админ-панель</a></li>
            <li><a href="/profile"><i class="fas fa-user"></i> Профиль</a></li>
            <li><a href="/settings"><i class="fas fa-cog"></i> Настройки</a></li>
            <li class="logout-btn"><a onclick="logoutUser()"><i class="fas fa-sign-out-alt"></i> Выйти</a></li>
        </ul>
    </aside>
    <main class="main-content">
        <div class="page-header">
            <div>
                <h1>Мои организации</h1>
                <p>Управляйте своими организациями и создавайте новые</p>
            </div>
            <button class="btn btn-primary" onclick="openCreateOrg()">
                <i class="fas fa-plus"></i> Создать организацию
            </button>
        </div>
        <div id="orgsContainer">
            <div class="empty-state" id="emptyState">
                <i class="fas fa-building"></i>
                <h3>У вас пока нет организаций</h3>
                <p>Создайте свою первую организацию и начните управлять бизнесом</p>
                <button class="btn btn-primary" onclick="openCreateOrg()">
                    <i class="fas fa-plus"></i> Создать организацию
                </button>
            </div>
            <div class="org-grid" id="orgGrid"></div>
        </div>
    </main>
    <div class="modal" id="createOrgModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Создать организацию</h2>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <form id="createOrgForm">
                <div class="form-group">
                    <label class="form-label">Название организации</label>
                    <input type="text" class="form-control" id="orgName" placeholder="Например: ООО Ромашка" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Тип организации</label>
                    <select class="form-control" id="orgType" required>
                        <option value="">Выберите тип...</option>
                        <option value="shop">🏪 Магазин</option>
                        <option value="library">📚 Библиотека</option>
                        <option value="company">🏢 Компания</option>
                        <option value="school">🎓 Школа</option>
                        <option value="clinic">🏥 Клиника</option>
                        <option value="other">📋 Другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Описание (необязательно)</label>
                    <textarea class="form-control" id="orgDesc" rows="3" placeholder="Краткое описание организации"></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    <i class="fas fa-rocket"></i> Создать организацию
                </button>
            </form>
        </div>
    </div>

    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        // ============================================
        // TYPEBIZ - ДАШБОРД (БЕЗ ДУБЛИРОВАНИЯ ПЕРЕМЕННЫХ)
        // ============================================

        // ===== ВЫХОД =====
        function logoutUser() {
            if (confirm('Вы уверены, что хотите выйти?')) {
                localStorage.removeItem('userData');
                localStorage.removeItem('isGuest');
                window.location.href = '/login';
            }
        }

        // ===== МОДАЛКА =====
        function openCreateOrg() {
            document.getElementById('createOrgModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('createOrgModal').classList.remove('active');
        }

        // ===== ЗАГРУЗКА =====
        async function loadDashboard() {
            const user = auth.getCurrentUser();
            if (!user) return;

            await loadOrganizations();
            
            document.getElementById('userName').textContent = user.full_name || 'Пользователь';
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userAvatar').textContent = (user.full_name || 'U')[0].toUpperCase();
            
            if (user.role === 'admin') {
                document.getElementById('adminLink').style.display = 'block';
            }
        }

        async function loadOrganizations() {
            try {
                const orgs = await db.getUserOrganizations();
                const grid = document.getElementById('orgGrid');
                const emptyState = document.getElementById('emptyState');

                grid.innerHTML = '';

                if (!orgs || orgs.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                emptyState.style.display = 'none';

                const iconMap = {
                    'shop': { icon: 'fa-store', class: 'shop' },
                    'library': { icon: 'fa-book', class: 'library' },
                    'company': { icon: 'fa-building', class: 'company' },
                    'school': { icon: 'fa-graduation-cap', class: 'other' },
                    'clinic': { icon: 'fa-heartbeat', class: 'other' },
                    'other': { icon: 'fa-cubes', class: 'other' }
                };

                const typeLabels = {
                    'shop': 'Магазин',
                    'library': 'Библиотека',
                    'company': 'Компания',
                    'school': 'Школа',
                    'clinic': 'Клиника',
                    'other': 'Другое'
                };

                orgs.forEach(org => {
                    const iconData = iconMap[org.type] || iconMap['other'];
                    const card = document.createElement('div');
                    card.className = 'org-card';
                    card.innerHTML = `
                        <div class="org-icon ${iconData.class}">
                            <i class="fas ${iconData.icon}"></i>
                        </div>
                        <h3>${org.name}</h3>
                        <p>${org.description || 'Нет описания'}</p>
                        <span class="org-type">${typeLabels[org.type] || org.type}</span>
                    `;
                    card.addEventListener('click', () => {
                        window.location.href = `/org?id=${org.id}`;
                    });
                    grid.appendChild(card);
                });

                const createCard = document.createElement('div');
                createCard.className = 'org-card create-org-card';
                createCard.innerHTML = `
                    <i class="fas fa-plus-circle"></i>
                    <h4>Создать организацию</h4>
                `;
                createCard.addEventListener('click', openCreateOrg);
                grid.appendChild(createCard);

            } catch (error) {
                console.error('Load organizations error:', error);
                alert('Ошибка загрузки организаций: ' + error.message);
            }
        }

        // ===== СОЗДАНИЕ ОРГАНИЗАЦИИ =====
        document.getElementById('createOrgForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('orgName').value.trim();
            const type = document.getElementById('orgType').value;
            const description = document.getElementById('orgDesc').value.trim();

            if (!name) {
                alert('Введите название организации');
                return;
            }

            if (!type) {
                alert('Выберите тип организации');
                return;
            }

            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Создание...';

            try {
                await db.createOrganization({
                    name,
                    type,
                    description: description || '',
                    is_active: true,
                    settings: {}
                });

                alert('Организация создана! 🎉');
                closeModal();
                document.getElementById('createOrgForm').reset();
                await loadOrganizations();

            } catch (error) {
                console.error('Create organization error:', error);
                alert('Ошибка: ' + error.message);
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-rocket"></i> Создать организацию';
        });

        // Закрытие модалки по клику вне
        document.getElementById('createOrgModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        (async function init() {
            const isAuth = await auth.requireAuth();
            if (!isAuth) return;

            await loadDashboard();
            console.log('✅ Dashboard loaded');
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ заборонено — Typebiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #0F1115;
            --ink-soft: #171A21;
            --ink-line: #2A2E38;
            --gold: #F2A93B;
            --teal: #46C9B8;
            --red: #E2503E;
            --text-onink: #E7E4DA;
            --muted: #8B93A6;
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--ink);
            color: var(--text-onink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 20% 50%, rgba(226, 80, 62, 0.05) 0%, transparent 50%);
        }
        .banned-box {
            background: var(--ink-soft);
            border: 1px solid var(--ink-line);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 560px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s ease;
            position: relative;
            overflow: hidden;
        }
        .banned-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--red), var(--gold), var(--red));
            background-size: 200% 100%;
            animation: gradientMove 3s ease infinite;
        }
        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .banned-box .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(226, 80, 62, 0.12);
            margin-bottom: 1.2rem;
            position: relative;
        }
        .banned-box .icon-wrap .icon { font-size: 3rem; color: var(--red); }
        .banned-box .icon-wrap .shield {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--ink-soft);
            border: 2px solid var(--red);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--red);
        }
        .banned-box h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }
        .banned-box .subtitle {
            color: var(--muted);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .banned-box .divider {
            width: 50px;
            height: 2px;
            background: var(--ink-line);
            margin: 1.2rem auto;
            border-radius: 2px;
        }
        .banned-box .reason {
            background: rgba(226, 80, 62, 0.08);
            border: 1px solid rgba(226, 80, 62, 0.2);
            border-radius: 10px;
            padding: 0.9rem 1.2rem;
            margin: 0.8rem 0 1.2rem;
            text-align: left;
        }
        .banned-box .reason .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .banned-box .reason .text {
            font-weight: 500;
            color: var(--text-onink);
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .banned-box .info-text {
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 1.2rem;
        }
        .banned-box .info-text i { margin-right: 0.3rem; color: var(--gold); }
        .banned-box .btn-group {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 0.5rem;
        }
        .banned-box .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.3rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid transparent;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            flex: 1;
            justify-content: center;
            min-width: 140px;
        }
        .banned-box .btn-primary {
            background: var(--gold);
            color: var(--ink);
        }
        .banned-box .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(242, 169, 59, 0.3);
        }
        .banned-box .btn-danger {
            background: var(--red);
            color: white;
        }
        .banned-box .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(226, 80, 62, 0.3);
        }
        .banned-box .badge {
            display: inline-block;
            background: rgba(226, 80, 62, 0.15);
            color: var(--red);
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 0.4rem;
        }
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            z-index: 99999;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: var(--ink-soft);
            border: 1px solid var(--ink-line);
            border-radius: 12px;
            padding: 2rem;
            max-width: 520px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-box .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.2rem;
        }
        .modal-box .modal-header h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.3rem;
        }
        .modal-box .modal-close {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--muted);
            transition: color 0.2s;
        }
        .modal-box .modal-close:hover { color: var(--text-onink); }
        .modal-box .form-group { margin-bottom: 1rem; }
        .modal-box .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.3rem;
            font-size: 0.85rem;
        }
        .modal-box .form-control {
            width: 100%;
            padding: 0.7rem 0.9rem;
            background: var(--ink);
            border: 1px solid var(--ink-line);
            border-radius: 6px;
            color: var(--text-onink);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }
        .modal-box .form-control:focus {
            outline: none;
            border-color: var(--gold);
        }
        .modal-box textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }
        .modal-box .btn-block {
            width: 100%;
            justify-content: center;
        }
        .modal-box .text-muted { color: var(--muted); font-size: 0.85rem; }
        .modal-box .text-success { color: var(--teal); }
        .modal-box .text-danger { color: var(--red); }
        .modal-box .text-warning { color: #F59E0B; }

        .appeal-status {
            display: inline-block;
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .appeal-status.pending { background: rgba(245, 158, 11, 0.2); color: #F59E0B; }
        .appeal-status.approved { background: rgba(70, 201, 184, 0.2); color: var(--teal); }
        .appeal-status.rejected { background: rgba(226, 80, 62, 0.2); color: var(--red); }
        .appeal-status.closed { background: rgba(139, 147, 166, 0.2); color: var(--muted); }

        .appeal-message {
            padding: 0.6rem 0.8rem;
            margin: 0.5rem 0;
            border-radius: 6px;
            background: var(--ink);
            border-left: 3px solid var(--muted);
            text-align: left;
        }
        .appeal-message.user { border-left-color: var(--teal); }
        .appeal-message.admin { border-left-color: var(--gold); }
        .appeal-message .msg-meta {
            font-size: 0.7rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.2rem;
        }
        .appeal-message .msg-text { font-size: 0.9rem; }

        .btn-gold {
            background: var(--gold);
            color: var(--ink);
            border: none;
        }
        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(242, 169, 59, 0.3);
        }

        @media (max-width: 480px) {
            .banned-box { padding: 2rem 1.2rem; }
            .banned-box .btn-group { flex-direction: column; }
            .banned-box .btn { flex: none; }
            .banned-box h1 { font-size: 1.4rem; }
            .modal-box { padding: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="banned-box">
        <div class="icon-wrap">
            <i class="fas fa-ban icon"></i>
            <div class="shield"><i class="fas fa-shield-alt"></i></div>
        </div>
        <span class="badge"><i class="fas fa-lock"></i> Обмежений доступ</span>
        <h1>Доступ заборонено</h1>
        <p class="subtitle">Ваш обліковий запис заблоковано</p>
        <div class="divider"></div>
        <div class="reason">
            <div class="label"><i class="fas fa-info-circle"></i> Причина блокування</div>
            <div class="text" id="banReason">
                <i class="fas fa-exclamation-triangle" style="color: var(--red); margin-right: 0.5rem;"></i>
                Порушення правил використання платформи
            </div>
        </div>
        <p class="info-text">
            <i class="fas fa-envelope"></i>
            Якщо ви вважаєте, що це помилка, подайте апеляцію
        </p>
        <div class="btn-group">
            <button class="btn btn-danger" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Вийти
            </button>
            <button class="btn btn-primary" id="appealBtn">
                <i class="fas fa-gavel"></i> Апеляція
            </button>
        </div>
    </div>

    <div class="modal-overlay" id="appealModal">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="appealModalTitle">📋 Апеляція</h2>
                <button class="modal-close" onclick="closeAppealModal()">&times;</button>
            </div>
            <div id="appealContent"></div>
        </div>
    </div>

    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        var userData = JSON.parse(localStorage.getItem('userData') || '{}');
        var userId = userData.id;
        var banReason = userData.ban_reason || 'Порушення правил використання платформи';
        var currentAppeal = null;
        var appealMessages = [];

        document.getElementById('banReason').innerHTML =
            '<i class="fas fa-exclamation-triangle" style="color: var(--red); margin-right: 0.5rem;"></i> ' + banReason;

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('userData');
            localStorage.removeItem('isGuest');
            window.location.href = '/login';
        });

        document.getElementById('appealBtn').addEventListener('click', function() {
            openAppealModal();
        });

        function openAppealModal() {
            document.getElementById('appealModal').classList.add('active');
            loadAppeal();
        }

        function closeAppealModal() {
            document.getElementById('appealModal').classList.remove('active');
        }

        document.getElementById('appealModal').addEventListener('click', function(e) {
            if (e.target === this) closeAppealModal();
        });

        async function loadAppeal() {
            var container = document.getElementById('appealContent');
            container.innerHTML = '<p class="text-muted">Завантаження...</p>';

            try {
                var appeals = await db.supabaseQuery('appeals?user_id=eq.' + userId + '&order=created_at.desc&limit=1');
                
                if (appeals && appeals.length > 0) {
                    currentAppeal = appeals[0];
                    await loadAppealMessages(currentAppeal.id);
                    renderAppealView();
                } else {
                    renderAppealForm();
                }
            } catch (error) {
                container.innerHTML = '<p class="text-danger">Помилка: ' + error.message + '</p>';
            }
        }

        async function loadAppealMessages(appealId) {
            try {
                var messages = await db.supabaseQuery('appeal_messages?appeal_id=eq.' + appealId + '&order=created_at.asc');
                appealMessages = messages || [];
            } catch (error) {
                appealMessages = [];
            }
        }

        function renderAppealView() {
            var container = document.getElementById('appealContent');
            
            if (!currentAppeal) {
                renderAppealForm();
                return;
            }

            var statusLabels = {
                'pending': '⏳ Очікується',
                'approved': '✅ Схвалено',
                'rejected': '❌ Відмовлено',
                'closed': '🔒 Закрито'
            };
            var statusClasses = {
                'pending': 'pending',
                'approved': 'approved',
                'rejected': 'rejected',
                'closed': 'closed'
            };

            var html = '';
            html += '<div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:0.5rem;margin-bottom:1rem;">';
            html += '<span style="font-size:0.85rem;color:var(--muted);">№ ' + currentAppeal.id.substring(0, 8) + '</span>';
            html += '<span class="appeal-status ' + (statusClasses[currentAppeal.status] || 'pending') + '">' + (statusLabels[currentAppeal.status] || currentAppeal.status) + '</span>';
            html += '</div>';

            if (appealMessages.length > 0) {
                html += '<div style="max-height:250px;overflow-y:auto;margin-bottom:0.8rem;">';
                for (var i = 0; i < appealMessages.length; i++) {
                    var msg = appealMessages[i];
                    var isAdmin = msg.sender_type === 'admin' || msg.sender_type === 'owner';
                    html += '<div class="appeal-message ' + (isAdmin ? 'admin' : 'user') + '">';
                    html += '<div class="msg-meta">';
                    html += '<span>' + (isAdmin ? '👑 Адміністрація' : '👤 Ви') + '</span>';
                    html += '<span>' + formatDateTimeKyiv(msg.created_at) + '</span>';
                    html += '</div>';
                    html += '<div class="msg-text">' + msg.message + '</div>';
                    html += '</div>';
                }
                html += '</div>';
            }

            if (currentAppeal.status === 'approved') {
                html += '<div style="background:rgba(70,201,184,0.1);border:1px solid var(--teal);border-radius:8px;padding:0.8rem;margin:0.8rem 0;text-align:center;">';
                html += '<p style="color:var(--teal);font-weight:600;">✅ Вашу апеляцію схвалено! Ви розблоковані.</p>';
                html += '<p style="font-size:0.8rem;color:var(--muted);margin-top:0.3rem;">Апеляція #' + currentAppeal.id.substring(0, 8) + '</p>';
                html += '</div>';
                
                setTimeout(function() {
                    window.location.href = '/login';
                }, 3000);
            } else if (currentAppeal.status === 'rejected') {
                html += '<div style="background:rgba(226,80,62,0.1);border:1px solid var(--red);border-radius:8px;padding:0.8rem;margin:0.8rem 0;text-align:center;">';
                html += '<p style="color:var(--red);font-weight:600;">❌ Вашу апеляцію відхилено</p>';
                html += '</div>';
                
                if (currentAppeal.status === 'rejected') {
                    html += '<button class="btn btn-gold btn-block" onclick="createNewAppeal()" style="margin-top:0.8rem;">';
                    html += '<i class="fas fa-plus"></i> Подати нову апеляцію';
                    html += '</button>';
                }
            } else if (currentAppeal.status === 'pending') {
                html += '<hr style="border-color:var(--ink-line);margin:0.8rem 0;">';
                html += '<form id="appealReplyForm">';
                html += '<textarea class="form-control" id="appealReplyMessage" placeholder="Напишіть повідомлення адміністрації..." rows="2"></textarea>';
                html += '<button type="submit" class="btn btn-gold btn-block" style="margin-top:0.6rem;">';
                html += '<i class="fas fa-paper-plane"></i> Відправити повідомлення';
                html += '</button>';
                html += '</form>';
            } else {
                html += '<p class="text-muted" style="text-align:center;padding:0.5rem 0;">🔒 Апеляцію закрито</p>';
            }

            container.innerHTML = html;

            var form = document.getElementById('appealReplyForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    sendAppealMessage();
                });
            }
        }

        function renderAppealForm() {
            var container = document.getElementById('appealContent');
            var html = '';
            html += '<p style="font-size:0.9rem;color:var(--muted);margin-bottom:1rem;">Подайте апеляцію, щоб адміністрація переглянула ваше блокування.</p>';
            html += '<form id="appealCreateForm">';
            html += '<div class="form-group">';
            html += '<label class="form-label">Причина блокування</label>';
            html += '<input type="text" class="form-control" value="' + banReason + '" disabled style="opacity:0.7;cursor:not-allowed;">';
            html += '</div>';
            html += '<div class="form-group">';
            html += '<label class="form-label">Ваше пояснення <span style="color:var(--red);">*</span></label>';
            html += '<textarea class="form-control" id="appealMessage" placeholder="Опишіть вашу ситуацію детально..." rows="3" required></textarea>';
            html += '</div>';
            html += '<button type="submit" class="btn btn-gold btn-block" id="submitAppealBtn">';
            html += '<i class="fas fa-paper-plane"></i> Відправити апеляцію';
            html += '</button>';
            html += '<p class="text-muted" style="margin-top:0.8rem;text-align:center;font-size:0.8rem;">Адміністрація розгляне вашу апеляцію протягом 24 годин</p>';
            html += '</form>';
            container.innerHTML = html;

            document.getElementById('appealCreateForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                await createAppeal();
            });
        }

        async function createAppeal() {
            var message = document.getElementById('appealMessage').value.trim();
            if (!message) {
                showToast('Введіть пояснення', 'warning');
                return;
            }

            var submitBtn = document.getElementById('submitAppealBtn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Відправка...';

            try {
                var existingAppeals = await db.supabaseQuery('appeals?user_id=eq.' + userId + '&status=eq.pending');
                if (existingAppeals && existingAppeals.length > 0) {
                    showToast('У вас вже є активна апеляція.', 'warning');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Відправити апеляцію';
                    return;
                }

                var appealData = {
                    user_id: userId,
                    ban_reason: banReason,
                    status: 'pending',
                    created_at: new Date().toISOString()
                };

                var result = await db.supabaseQuery('appeals', {
                    method: 'POST',
                    body: JSON.stringify(appealData),
                    headers: { 'Prefer': 'return=representation' }
                });

                if (!result || result.length === 0) {
                    throw new Error('Не вдалося створити апеляцію');
                }

                currentAppeal = result[0];

                await db.supabaseQuery('appeal_messages', {
                    method: 'POST',
                    body: JSON.stringify({
                        appeal_id: currentAppeal.id,
                        sender_id: userId,
                        sender_type: 'user',
                        message: message,
                        created_at: new Date().toISOString()
                    })
                });

                await db.addLog('Створено апеляцію', 'appeal', currentAppeal.id, { user_id: userId });

                showToast('✅ Апеляцію подано!', 'success');
                
                document.getElementById('appealBtn').innerHTML = '<i class="fas fa-check-circle"></i> Апеляція подана';
                document.getElementById('appealBtn').style.opacity = '0.6';
                document.getElementById('appealBtn').style.cursor = 'default';
                document.getElementById('appealBtn').disabled = true;

                await loadAppealMessages(currentAppeal.id);
                renderAppealView();

            } catch (error) {
                showToast('Помилка: ' + error.message, 'error');
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Відправити апеляцію';
        }

        function createNewAppeal() {
            currentAppeal = null;
            appealMessages = [];
            renderAppealForm();
        }

        async function sendAppealMessage() {
            var textarea = document.getElementById('appealReplyMessage');
            if (!textarea) return;

            var message = textarea.value.trim();
            if (!message) {
                showToast('Введіть повідомлення', 'warning');
                return;
            }

            var btn = document.querySelector('#appealReplyForm button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Відправка...';

            try {
                await db.supabaseQuery('appeal_messages', {
                    method: 'POST',
                    body: JSON.stringify({
                        appeal_id: currentAppeal.id,
                        sender_id: userId,
                        sender_type: 'user',
                        message: message,
                        created_at: new Date().toISOString()
                    })
                });

                await db.addLog('Повідомлення в апеляції', 'appeal', currentAppeal.id, { user_id: userId });
                showToast('Повідомлення відправлено!', 'success');

                textarea.value = '';
                await loadAppealMessages(currentAppeal.id);
                renderAppealView();

            } catch (error) {
                showToast('Помилка: ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Відправити повідомлення';
        }

        function showToast(message, type) {
            var container = document.getElementById('toastContainer');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toastContainer';
                container.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:999999;display:flex;flex-direction:column;gap:10px;max-width:380px;width:100%;pointer-events:none;';
                document.body.appendChild(container);
            }
            var colors = { success: '#10b981', error: '#ef4444', warning: '#f59e0b', info: '#4f46e5' };
            var icons = { success: 'fa-check-circle', error: 'fa-exclamation-circle', warning: 'fa-exclamation-triangle', info: 'fa-info-circle' };
            var toast = document.createElement('div');
            toast.style.cssText = 'background:var(--ink-soft);border:1px solid var(--ink-line);border-left:4px solid ' + colors[type] + ';border-radius:8px;padding:14px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,0.5);animation:slideInRight 0.3s ease;pointer-events:auto;color:var(--text-onink);font-family:"IBM Plex Sans",sans-serif;';
            toast.innerHTML = '<span style="color:' + colors[type] + ';font-size:1.2rem;flex-shrink:0;"><i class="fas ' + (icons[type] || icons.info) + '"></i></span><span style="flex:1;font-size:0.9rem;">' + message + '</span><button onclick="this.parentElement.remove()" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:1rem;padding:0 4px;"><i class="fas fa-times"></i></button>';
            container.appendChild(toast);
            setTimeout(function() {
                if (toast.parentElement) {
                    toast.style.animation = 'slideOutRight 0.3s ease forwards';
                    setTimeout(function() { if (toast.parentElement) toast.remove(); }, 300);
                }
            }, 5000);
        }

        function formatDateTimeKyiv(d) {
            try { return new Date(d).toLocaleString('uk-UA', { timeZone: 'Europe/Kyiv' }); } catch { return ''; }
        }

        sessionStorage.setItem('onBannedPage', 'true');
        window.addEventListener('beforeunload', function() {
            sessionStorage.removeItem('onBannedPage');
        });

        async function checkExistingAppeal() {
            try {
                var appeals = await db.supabaseQuery('appeals?user_id=eq.' + userId + '&order=created_at.desc&limit=1');
                if (appeals && appeals.length > 0) {
                    var appeal = appeals[0];
                    if (appeal.status === 'pending') {
                        document.getElementById('appealBtn').innerHTML = '<i class="fas fa-check-circle"></i> Апеляція подана';
                        document.getElementById('appealBtn').style.opacity = '0.6';
                        document.getElementById('appealBtn').style.cursor = 'default';
                        document.getElementById('appealBtn').disabled = true;
                    } else if (appeal.status === 'approved') {
                        document.getElementById('appealBtn').innerHTML = '<i class="fas fa-check-circle" style="color:var(--teal);"></i> Розблоковано';
                        document.getElementById('appealBtn').style.opacity = '0.6';
                        document.getElementById('appealBtn').style.cursor = 'default';
                        document.getElementById('appealBtn').disabled = true;
                        setTimeout(function() {
                            window.location.href = '/login';
                        }, 3000);
                    } else if (appeal.status === 'rejected') {
                        document.getElementById('appealBtn').innerHTML = '<i class="fas fa-gavel"></i> Апеляція (повторно)';
                        document.getElementById('appealBtn').style.opacity = '1';
                        document.getElementById('appealBtn').style.cursor = 'pointer';
                        document.getElementById('appealBtn').disabled = false;
                    }
                }
            } catch (e) {
                console.error('Check existing appeal error:', e);
            }
        }

        checkExistingAppeal();
    </script>
</body>
</html>

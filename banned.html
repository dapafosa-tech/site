<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доступ заборонено — Typebiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #0F1115;
            --ink-soft: #171A21;
            --ink-line: #2A2E38;
            --gold: #F2A93B;
            --teal: #46C9B8;
            --red: #E2503E;
            --text-onink: #E7E4DA;
            --muted: #8B93A6;
            --radius: 12px;
            --radius-sm: 8px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'IBM Plex Sans', sans-serif;
            background: var(--ink);
            color: var(--text-onink);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background-image: radial-gradient(circle at 20% 50%, rgba(226, 80, 62, 0.05) 0%, transparent 50%);
        }
        .banned-box {
            background: var(--ink-soft);
            border: 1px solid var(--ink-line);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 560px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.6s ease;
            position: relative;
            overflow: hidden;
        }
        .banned-box::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--red), var(--gold), var(--red));
            background-size: 200% 100%;
            animation: gradientMove 3s ease infinite;
        }
        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .banned-box .icon-wrap {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(226, 80, 62, 0.12);
            margin-bottom: 1.2rem;
            position: relative;
        }
        .banned-box .icon-wrap .icon { font-size: 3rem; color: var(--red); }
        .banned-box .icon-wrap .shield {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--ink-soft);
            border: 2px solid var(--red);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            color: var(--red);
        }
        .banned-box h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
        }
        .banned-box .subtitle {
            color: var(--muted);
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
        }
        .banned-box .divider {
            width: 50px;
            height: 2px;
            background: var(--ink-line);
            margin: 1.2rem auto;
            border-radius: 2px;
        }
        .banned-box .reason {
            background: rgba(226, 80, 62, 0.08);
            border: 1px solid rgba(226, 80, 62, 0.2);
            border-radius: 10px;
            padding: 0.9rem 1.2rem;
            margin: 0.8rem 0 1.2rem;
            text-align: left;
        }
        .banned-box .reason .label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--muted);
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .banned-box .reason .text {
            font-weight: 500;
            color: var(--text-onink);
            font-size: 0.9rem;
            line-height: 1.5;
        }
        .banned-box .info-text {
            color: var(--muted);
            font-size: 0.85rem;
            line-height: 1.6;
            margin-bottom: 1.2rem;
        }
        .banned-box .info-text i { margin-right: 0.3rem; color: var(--gold); }
        .banned-box .btn-group {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .banned-box .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 1.3rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            border: 1px solid transparent;
            text-decoration: none;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
        }
        .banned-box .btn-primary {
            background: var(--gold);
            color: var(--ink);
        }
        .banned-box .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(242, 169, 59, 0.3);
        }
        .banned-box .btn-danger {
            background: var(--red);
            color: white;
        }
        .banned-box .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(226, 80, 62, 0.3);
        }
        .banned-box .btn-outline {
            background: transparent;
            border-color: var(--ink-line);
            color: var(--text-onink);
        }
        .banned-box .btn-outline:hover {
            background: var(--ink);
            border-color: var(--muted);
            transform: translateY(-2px);
        }
        .banned-box .badge {
            display: inline-block;
            background: rgba(226, 80, 62, 0.15);
            color: var(--red);
            padding: 0.2rem 0.7rem;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            margin-bottom: 0.4rem;
        }
        .countdown {
            margin-top: 1.2rem;
            padding: 0.6rem;
            background: rgba(226, 80, 62, 0.06);
            border-radius: 8px;
            border: 1px solid rgba(226, 80, 62, 0.1);
            font-size: 0.85rem;
            color: var(--muted);
        }
        .countdown span {
            color: var(--gold);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Апеляція */
        .appeal-section {
            margin-top: 1.2rem;
            padding-top: 1.2rem;
            border-top: 1px solid var(--ink-line);
        }
        .appeal-section .appeal-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            margin-bottom: 0.8rem;
        }
        .appeal-section .appeal-status .status-badge {
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
        }
        .appeal-section .appeal-status .status-badge.pending { background: rgba(245, 158, 11, 0.2); color: #F59E0B; }
        .appeal-section .appeal-status .status-badge.approved { background: rgba(34, 197, 94, 0.2); color: #22C55E; }
        .appeal-section .appeal-status .status-badge.rejected { background: rgba(226, 80, 62, 0.2); color: var(--red); }
        
        .appeal-section .appeal-messages {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 0.8rem;
            text-align: left;
        }
        .appeal-section .appeal-messages .msg {
            padding: 0.5rem 0.7rem;
            margin-bottom: 0.4rem;
            border-radius: 6px;
            font-size: 0.85rem;
            background: var(--ink);
            border-left: 3px solid var(--muted);
        }
        .appeal-section .appeal-messages .msg.user { border-left-color: var(--teal); }
        .appeal-section .appeal-messages .msg.admin { border-left-color: var(--gold); }
        .appeal-section .appeal-messages .msg .msg-meta {
            font-size: 0.7rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
        }
        .appeal-section .appeal-form textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            background: var(--ink);
            border: 1px solid var(--ink-line);
            border-radius: 6px;
            color: var(--text-onink);
            font-family: 'IBM Plex Sans', sans-serif;
            font-size: 0.9rem;
            resize: vertical;
            min-height: 60px;
        }
        .appeal-section .appeal-form textarea:focus {
            outline: none;
            border-color: var(--gold);
        }
        .appeal-section .appeal-form .btn {
            margin-top: 0.5rem;
            width: 100%;
            justify-content: center;
        }

        @media (max-width: 480px) {
            .banned-box { padding: 2rem 1.2rem; }
            .banned-box .btn-group { flex-direction: column; }
            .banned-box .btn { justify-content: center; }
            .banned-box h1 { font-size: 1.4rem; }
        }
    </style>
</head>
<body>
    <div class="banned-box" id="bannedBox">
        <div class="icon-wrap">
            <i class="fas fa-ban icon"></i>
            <div class="shield"><i class="fas fa-shield-alt"></i></div>
        </div>

        <span class="badge"><i class="fas fa-lock"></i> Обмежений доступ</span>
        <h1>Доступ заборонено</h1>
        <p class="subtitle">Ваш обліковий запис заблоковано</p>

        <div class="divider"></div>

        <div class="reason">
            <div class="label"><i class="fas fa-info-circle"></i> Причина блокування</div>
            <div class="text" id="banReason">
                <i class="fas fa-exclamation-triangle" style="color: var(--red); margin-right: 0.5rem;"></i>
                Порушення правил використання платформи
            </div>
        </div>

        <p class="info-text">
            <i class="fas fa-envelope"></i>
            Якщо ви вважаєте, що це помилка, подайте апеляцію нижче
        </p>

        <!-- Секція апеляції -->
        <div class="appeal-section" id="appealSection">
            <div id="appealContent">
                <p class="text-muted" style="font-size:0.85rem;">Завантаження...</p>
            </div>
        </div>

        <div class="btn-group" style="margin-top: 1rem;">
            <button class="btn btn-danger" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i> Вийти
            </button>
        </div>

        <div class="countdown">
            <i class="fas fa-clock" style="color: var(--gold);"></i>
            Автоматичний вихід через <span id="countdown">10</span> секунд
        </div>
    </div>

    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        // ============================================
        // СТОРІНКА BANNED З АПЕЛЯЦІЄЮ
        // ============================================

        var userData = JSON.parse(localStorage.getItem('userData') || '{}');
        var userId = userData.id;
        var banReason = userData.ban_reason || 'Порушення правил використання платформи';
        var currentAppeal = null;
        var appealMessages = [];

        document.getElementById('banReason').innerHTML = 
            '<i class="fas fa-exclamation-triangle" style="color: var(--red); margin-right: 0.5rem;"></i> ' + banReason;

        // ============================================
        // ЗАВАНТАЖЕННЯ АПЕЛЯЦІЇ
        // ============================================

        async function loadAppeal() {
            var container = document.getElementById('appealContent');
            
            try {
                // Шукаємо активну апеляцію для цього бана
                var appeals = await db.supabaseQuery('appeals?user_id=eq.' + userId + '&status=neq.closed&order=created_at.desc');
                
                if (appeals && appeals.length > 0) {
                    currentAppeal = appeals[0];
                    await loadAppealMessages(currentAppeal.id);
                    renderAppeal();
                } else {
                    // Немає апеляції - показуємо форму
                    renderAppealForm();
                }
            } catch (error) {
                console.error('Load appeal error:', error);
                container.innerHTML = '<p class="text-muted" style="font-size:0.85rem;">Помилка завантаження</p>';
            }
        }

        async function loadAppealMessages(appealId) {
            try {
                var messages = await db.supabaseQuery('appeal_messages?appeal_id=eq.' + appealId + '&order=created_at.asc');
                appealMessages = messages || [];
            } catch (error) {
                console.error('Load appeal messages error:', error);
                appealMessages = [];
            }
        }

        function renderAppeal() {
            var container = document.getElementById('appealContent');
            
            if (!currentAppeal) {
                renderAppealForm();
                return;
            }

            var statusLabels = {
                'pending': 'Очікується',
                'approved': 'Схвалено ✅',
                'rejected': 'Відмовлено ❌',
                'closed': 'Закрито'
            };
            var statusClasses = {
                'pending': 'pending',
                'approved': 'approved',
                'rejected': 'rejected',
                'closed': 'pending'
            };

            var html = '';
            html += '<div class="appeal-status">';
            html += 'Статус: <span class="status-badge ' + (statusClasses[currentAppeal.status] || 'pending') + '">' + 
                    (statusLabels[currentAppeal.status] || currentAppeal.status) + '</span>';
            html += '</div>';

            // Повідомлення
            if (appealMessages.length > 0) {
                html += '<div class="appeal-messages">';
                for (var i = 0; i < appealMessages.length; i++) {
                    var msg = appealMessages[i];
                    var isAdmin = msg.sender_type === 'admin' || msg.sender_type === 'owner';
                    html += '<div class="msg ' + (isAdmin ? 'admin' : 'user') + '">';
                    html += '<div class="msg-meta">';
                    html += '<span>' + (isAdmin ? '👑 Адміністрація' : '👤 Ви') + '</span>';
                    html += '<span>' + formatDateTimeKyiv(msg.created_at) + '</span>';
                    html += '</div>';
                    html += msg.message;
                    html += '</div>';
                }
                html += '</div>';
            }

            // Якщо апеляція закрита або схвалена/відхилена - не показуємо форму
            if (currentAppeal.status === 'closed' || currentAppeal.status === 'approved' || currentAppeal.status === 'rejected') {
                if (currentAppeal.status === 'approved') {
                    html += '<p style="color: var(--teal); font-size: 0.9rem; margin-top: 0.5rem;">✅ Вашу апеляцію схвалено! Ви будете розблоковані найближчим часом.</p>';
                } else if (currentAppeal.status === 'rejected') {
                    html += '<p style="color: var(--red); font-size: 0.9rem; margin-top: 0.5rem;">❌ Вашу апеляцію відхилено. Ви можете подати нову апеляцію.</p>';
                    // Кнопка для нової апеляції
                    html += '<button class="btn btn-primary" onclick="createNewAppeal()" style="margin-top: 0.5rem; width: 100%; justify-content: center;">';
                    html += '<i class="fas fa-plus"></i> Подати нову апеляцію';
                    html += '</button>';
                } else {
                    html += '<p style="color: var(--muted); font-size: 0.85rem; margin-top: 0.5rem;">🔒 Цю апеляцію закрито</p>';
                }
            } else {
                // Форма для відповіді
                html += '<form class="appeal-form" id="appealReplyForm">';
                html += '<textarea id="appealMessage" placeholder="Напишіть повідомлення адміністрації..." rows="2"></textarea>';
                html += '<button type="submit" class="btn btn-primary"><i class="fas fa-paper-plane"></i> Відправити</button>';
                html += '</form>';
            }

            container.innerHTML = html;

            // Обробник форми
            var form = document.getElementById('appealReplyForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    sendAppealMessage();
                });
            }
        }

        function renderAppealForm() {
            var container = document.getElementById('appealContent');
            
            var html = '';
            html += '<p style="font-size: 0.9rem; color: var(--muted); margin-bottom: 0.8rem;">';
            html += 'Подайте апеляцію, щоб адміністрація переглянула ваше блокування.';
            html += '</p>';
            html += '<form class="appeal-form" id="appealCreateForm">';
            html += '<textarea id="appealReason" placeholder="Опишіть вашу ситуацію..." rows="3" required></textarea>';
            html += '<button type="submit" class="btn btn-primary"><i class="fas fa-gavel"></i> Подати апеляцію</button>';
            html += '</form>';

            container.innerHTML = html;

            var form = document.getElementById('appealCreateForm');
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    createAppeal();
                });
            }
        }

        // ============================================
        // СТВОРЕННЯ АПЕЛЯЦІЇ
        // ============================================

        async function createAppeal() {
            var textarea = document.getElementById('appealReason');
            if (!textarea) return;
            
            var message = textarea.value.trim();
            if (!message) {
                showToast('Введіть опис вашої ситуації', 'warning');
                return;
            }

            var btn = document.querySelector('#appealCreateForm button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Відправка...';

            try {
                var appealData = {
                    user_id: userId,
                    ban_reason: banReason,
                    status: 'pending',
                    created_at: new Date().toISOString()
                };

                var result = await db.supabaseQuery('appeals', {
                    method: 'POST',
                    body: JSON.stringify(appealData),
                    headers: { 'Prefer': 'return=representation' }
                });

                if (!result || result.length === 0) {
                    throw new Error('Не вдалося створити апеляцію');
                }

                currentAppeal = result[0];

                // Додаємо повідомлення
                await db.supabaseQuery('appeal_messages', {
                    method: 'POST',
                    body: JSON.stringify({
                        appeal_id: currentAppeal.id,
                        sender_id: userId,
                        sender_type: 'user',
                        message: message,
                        created_at: new Date().toISOString()
                    })
                });

                await db.addLog('Створено апеляцію', 'appeal', currentAppeal.id, { user_id: userId });
                showToast('Апеляцію подано! Очікуйте відповіді.', 'success');
                
                await loadAppealMessages(currentAppeal.id);
                renderAppeal();

            } catch (error) {
                showToast('Помилка: ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-gavel"></i> Подати апеляцію';
        }

        // ============================================
        // ВІДПРАВКА ПОВІДОМЛЕННЯ В АПЕЛЯЦІЇ
        // ============================================

        async function sendAppealMessage() {
            var textarea = document.getElementById('appealMessage');
            if (!textarea) return;
            
            var message = textarea.value.trim();
            if (!message) {
                showToast('Введіть повідомлення', 'warning');
                return;
            }

            if (!currentAppeal) {
                showToast('Апеляцію не знайдено', 'error');
                return;
            }

            var btn = document.querySelector('#appealReplyForm button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Відправка...';

            try {
                await db.supabaseQuery('appeal_messages', {
                    method: 'POST',
                    body: JSON.stringify({
                        appeal_id: currentAppeal.id,
                        sender_id: userId,
                        sender_type: 'user',
                        message: message,
                        created_at: new Date().toISOString()
                    })
                });

                await db.addLog('Повідомлення в апеляції', 'appeal', currentAppeal.id, { user_id: userId });
                showToast('Повідомлення відправлено!', 'success');
                
                textarea.value = '';
                await loadAppealMessages(currentAppeal.id);
                renderAppeal();

            } catch (error) {
                showToast('Помилка: ' + error.message, 'error');
            }

            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-paper-plane"></i> Відправити';
        }

        // ============================================
        // СТВОРЕННЯ НОВОЇ АПЕЛЯЦІЇ
        // ============================================

        async function createNewAppeal() {
            currentAppeal = null;
            appealMessages = [];
            renderAppealForm();
        }

        // ============================================
        // КНОПКА ВИХОДУ
        // ============================================

        document.getElementById('logoutBtn').addEventListener('click', function() {
            localStorage.removeItem('userData');
            localStorage.removeItem('isGuest');
            window.location.href = '/login';
        });

        // ============================================
        // ТАЙМЕР АВТОВИХОДУ
        // ============================================

        var seconds = 10;
        var countdownEl = document.getElementById('countdown');
        var timer = setInterval(function() {
            seconds--;
            countdownEl.textContent = seconds;
            if (seconds <= 0) {
                clearInterval(timer);
                localStorage.removeItem('userData');
                localStorage.removeItem('isGuest');
                window.location.href = '/login';
            }
        }, 1000);

        // ============================================
        // ЗАБОРОНЯЄМО check-auth.js РОБИТИ РЕДІРЕКТ
        // ============================================

        sessionStorage.setItem('onBannedPage', 'true');
        window.addEventListener('beforeunload', function() {
            sessionStorage.removeItem('onBannedPage');
        });

        // ============================================
        // ІНІЦІАЛІЗАЦІЯ
        // ============================================

        loadAppeal();

        console.log('✅ Сторінка banned завантажена');
        console.log('⏳ Автоматичний вихід через', seconds, 'секунд');
    </script>
</body>
</html>

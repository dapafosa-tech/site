<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — Typebiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 2rem;
        }

        .login-container {
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-xl);
            padding: 3rem;
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        .login-container .logo {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            color: var(--gray-800);
        }

        .login-container .logo i {
            color: var(--primary);
            margin-right: 0.5rem;
        }

        .login-container .logo span {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 0.5rem;
            color: var(--gray-800);
        }

        .login-container p.subtitle {
            text-align: center;
            color: var(--gray-500);
            margin-bottom: 2rem;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 1rem 0;
        }

        .form-options label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: var(--gray-600);
            cursor: pointer;
        }

        .form-options a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .form-options a:hover {
            text-decoration: underline;
        }

        .register-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--gray-500);
        }

        .register-link a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            padding: 0.5rem;
        }

        .password-toggle .toggle-btn:hover {
            color: var(--gray-600);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #debugLog {
            margin-top: 1rem;
            padding: 0.75rem;
            background: #1a202c;
            color: #68d391;
            border-radius: var(--radius-sm);
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            max-height: 150px;
            overflow-y: auto;
            display: none;
            white-space: pre-wrap;
            word-break: break-all;
        }

        #debugLog.show {
            display: block;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-cubes"></i>
            <span>Typebiz</span>
        </div>

        <h2>Добро пожаловать!</h2>
        <p class="subtitle">Войдите в свою учетную запись</p>

        <form id="loginForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required autofocus>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <div class="password-toggle">
                    <input type="password" id="password" class="form-control" placeholder="Введите пароль" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword()" aria-label="Показать/скрыть пароль">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="remember"> Запомнить меня
                </label>
                <a href="/forgot-password.html">Забыли пароль?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Войти
            </button>
        </form>

        <p class="register-link">
            Нет аккаунта? <a href="/register.html">Зарегистрироваться</a>
        </p>

        <div id="debugLog"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://iazzgxacdwhaxujoxtaz.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhenpneGFjZHdoYXh1am94dGF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3OTY3MDIsImV4cCI6MjEwMTM3MjcwMn0.quXjQ6575ACSjxnfa-hKkD6u3KMYE_5ZLdtqS4JKXI0';

        let debugLog = document.getElementById('debugLog');

        function logDebug(message, data = null) {
            debugLog.classList.add('show');
            const timestamp = new Date().toLocaleTimeString();
            let line = `[${timestamp}] ${message}`;
            if (data) {
                line += '\n' + JSON.stringify(data, null, 2);
            }
            debugLog.textContent += line + '\n---\n';
            debugLog.scrollTop = debugLog.scrollHeight;
            console.log(message, data || '');
        }

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.querySelector('.toggle-btn i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            logDebug('🚀 Начало входа');

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('loginBtn');

            logDebug('📝 Данные:', { email, password: '***' });

            if (!email || !password) {
                logDebug('❌ Ошибка: пустые поля');
                await showAlert('Пожалуйста, заполните все поля', 'warning');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Вход...';

            try {
                logDebug('📡 Отправка запроса в Supabase Auth');

                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });

                logDebug(`📡 Ответ: статус ${response.status}`);

                const data = await response.json();
                logDebug('📡 Данные ответа:', data);

                if (!response.ok) {
                    throw new Error(data.message || 'Ошибка входа');
                }

                if (data.session) {
                    logDebug('✅ Сессия получена, сохраняем');
                    localStorage.setItem('supabase_session', JSON.stringify(data.session));
                }

                logDebug('🎉 Вход успешен!');

                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Войти';

                await showToast('Добро пожаловать в Typebiz!', 'success');
                window.location.href = '/dashboard.html';

            } catch (error) {
                logDebug('❌ Ошибка:', error.message);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Войти';
                await showAlert(error.message, 'error');
            }
        });

        // ===== UI ФУНКЦИИ =====

        function showToast(message, type = 'info', duration = 3000) {
            const container = document.getElementById('toastContainer') || createToastContainer();
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };

            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <span class="toast-icon ${type}">
                    <i class="fas ${icons[type] || icons.info}"></i>
                </span>
                <span class="toast-message">${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s ease forwards';
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        function createToastContainer() {
            const container = document.createElement('div');
            container.id = 'toastContainer';
            container.className = 'toast-container';
            document.body.appendChild(container);
            return container;
        }

        function showAlert(message, type = 'info', title = '') {
            return new Promise((resolve) => {
                const overlay = document.createElement('div');
                overlay.className = 'modal-overlay active';

                const icons = {
                    success: 'fa-check-circle',
                    error: 'fa-exclamation-circle',
                    warning: 'fa-exclamation-triangle',
                    info: 'fa-info-circle'
                };

                const titles = {
                    success: 'Успешно!',
                    error: 'Ошибка!',
                    warning: 'Внимание!',
                    info: 'Информация'
                };

                overlay.innerHTML = `
                    <div class="modal-box">
                        <div class="modal-icon ${type}">
                            <i class="fas ${icons[type] || icons.info}"></i>
                        </div>
                        <h3>${title || titles[type] || 'Информация'}</h3>
                        <p>${message}</p>
                        <div class="modal-buttons">
                            <button class="btn btn-primary" id="alertOkBtn">OK</button>
                        </div>
                    </div>
                `;

                document.body.appendChild(overlay);
                
                const okBtn = overlay.querySelector('#alertOkBtn');
                okBtn.addEventListener('click', () => {
                    overlay.remove();
                    resolve(true);
                });

                overlay.addEventListener('click', (e) => {
                    if (e.target === overlay) {
                        overlay.remove();
                        resolve(true);
                    }
                });

                setTimeout(() => okBtn.focus(), 100);
            });
        }

        // Проверка авторизации
        (async () => {
            try {
                const session = localStorage.getItem('supabase_session');
                if (session) {
                    const sessionData = JSON.parse(session);
                    const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${sessionData.access_token}`
                        }
                    });
                    if (response.ok) {
                        window.location.href = '/dashboard.html';
                    }
                }
            } catch (e) {
                console.log('Не авторизован');
            }
        })();

        logDebug('🔧 Страница входа загружена');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Typebiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #0F1115;
            --ink-soft: #171A21;
            --ink-line: #2A2E38;
            --paper: #ECE7DA;
            --gold: #F2A93B;
            --teal: #46C9B8;
            --text-onink: #E7E4DA;
            --muted: #8B93A6;
            --radius: 10px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'IBM Plex Sans',sans-serif;
            background:var(--ink);
            color:var(--text-onink);
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            padding:2rem;
        }
        .login-container{
            background:var(--ink-soft);
            border:1px solid var(--ink-line);
            border-radius:var(--radius);
            padding:3rem;
            max-width:420px;
            width:100%;
            box-shadow:0 30px 60px rgba(0,0,0,0.5);
        }
        .logo{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            font-weight:700;
            font-size:1.5rem;
            margin-bottom:2rem;
        }
        .logo .tab{
            width:30px;height:30px;
            border-radius:4px;
            background:var(--gold);
            color:var(--ink);
            display:flex;
            align-items:center;
            justify-content:center;
            font-family:'IBM Plex Mono';
            font-size:0.75rem;
            font-weight:600;
            transform:rotate(-6deg);
        }
        h2{
            font-family:'Space Grotesk',sans-serif;
            font-size:1.5rem;
            text-align:center;
            margin-bottom:0.5rem;
        }
        .subtitle{
            text-align:center;
            color:var(--muted);
            margin-bottom:2rem;
            font-size:0.95rem;
        }
        .form-group{margin-bottom:1.5rem;}
        .form-label{
            display:block;
            font-weight:600;
            margin-bottom:0.4rem;
            font-size:0.85rem;
        }
        .form-control{
            width:100%;
            padding:0.75rem 1rem;
            background:var(--ink);
            border:1px solid var(--ink-line);
            border-radius:6px;
            color:var(--text-onink);
            font-family:'IBM Plex Sans',sans-serif;
            font-size:1rem;
            transition:border-color .2s;
        }
        .form-control:focus{
            outline:none;
            border-color:var(--gold);
        }
        .form-control::placeholder{color:var(--muted);}
        .password-toggle{position:relative;}
        .password-toggle .toggle-btn{
            position:absolute;
            right:1rem;
            top:50%;
            transform:translateY(-50%);
            background:none;
            border:none;
            color:var(--muted);
            cursor:pointer;
            padding:0.25rem;
        }
        .password-toggle .toggle-btn:hover{color:var(--text-onink);}
        .form-options{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin:1rem 0;
            font-size:0.9rem;
        }
        .form-options label{
            display:flex;
            align-items:center;
            gap:0.5rem;
            cursor:pointer;
            color:var(--muted);
        }
        .form-options a{color:var(--teal);}
        .form-options a:hover{color:var(--gold);}
        .btn{
            display:inline-flex;
            align-items:center;
            justify-content:center;
            gap:8px;
            padding:0.75rem 1.5rem;
            border-radius:6px;
            font-weight:600;
            font-size:1rem;
            cursor:pointer;
            border:1px solid transparent;
            transition:transform .15s,box-shadow .15s;
            width:100%;
        }
        .btn-gold{
            background:var(--gold);
            color:var(--ink);
        }
        .btn-gold:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(242,169,59,0.28);
        }
        .btn:disabled{opacity:0.6;cursor:not-allowed;}
        .register-link{
            text-align:center;
            margin-top:1.5rem;
            color:var(--muted);
            font-size:0.9rem;
        }
        .register-link a{color:var(--teal);font-weight:600;}
        .register-link a:hover{color:var(--gold);}
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--ink-soft);
            border: 1px solid var(--ink-line);
            border-radius: 8px;
            padding: 1rem 1.5rem;
            color: var(--text-onink);
            font-size: 0.9rem;
            max-width: 350px;
            z-index: 9999;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideIn 0.3s ease;
            display: none;
        }
        .toast.show { display: block; }
        .toast.success { border-left: 4px solid var(--teal); }
        .toast.error { border-left: 4px solid #E2503E; }
        .toast.warning { border-left: 4px solid var(--gold); }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @media(max-width:480px){
            .login-container{padding:2rem 1.5rem;}
            .form-options{flex-direction:column;gap:0.75rem;align-items:flex-start;}
        }
    </style>
</head>
<body>
    <div id="toast" class="toast"></div>
    
    <div class="login-container">
        <div class="logo">
            <span class="tab">Tb</span>
            <span class="brand-name">Typebiz</span>
        </div>

        <h2>Ласкаво просимо!</h2>
        <p class="subtitle">Увійдіть у свій обліковий запис</p>

        <form id="loginForm" autocomplete="off" novalidate>
            <div class="form-group">
                <label class="form-label" for="loginFullName">Ім'я та прізвище</label>
                <input type="text" id="loginFullName" class="form-control" placeholder="Іван Іванов" required autofocus>
                <span class="password-hint" style="display:block;margin-top:0.3rem;font-size:0.8rem;color:var(--muted,#8B93A6);">Рівно два слова, кожне з великої літери — як в акаунті</span>
            </div>

            <div class="form-group">
                <label class="form-label" for="email">Електронна пошта</label>
                <input type="email" id="email" class="form-control" placeholder="example@mail.com" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Пароль</label>
                <div class="password-toggle">
                    <input type="password" id="password" class="form-control" placeholder="Введіть пароль" required>
                    <button type="button" class="toggle-btn" onclick="togglePassword()" aria-label="Показати/сховати пароль">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" id="remember"> Запам'ятати мене
                </label>
                <a href="/forgot-password">Забули пароль?</a>
            </div>

            <button type="submit" class="btn btn-gold" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Увійти
            </button>
        </form>

        <p class="register-link">
            Немає акаунта? <a href="/register">Зареєструватися</a>
        </p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/check-auth.js"></script>
    <script>
        var toastTimeout = null;

        function showToast(message, type) {
            var toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + (type || '');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(function() {
                toast.classList.remove('show');
            }, 5000);
        }

        function togglePassword() {
            var input = document.getElementById('password');
            var icon = document.querySelector('.toggle-btn i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        (function showAccountGoneNoticeIfAny() {
            try {
                var msg = sessionStorage.getItem('accountGoneMsg');
                if (msg) {
                    sessionStorage.removeItem('accountGoneMsg');
                    showToast(msg, 'error');
                }
            } catch (e) {}
        })();

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var fullName = document.getElementById('loginFullName').value.trim();
            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;
            var submitBtn = document.getElementById('loginBtn');

            if (!fullName || !email || !password) {
                showToast('Заповніть усі поля', 'warning');
                return;
            }

            if (!auth.isValidFullName(fullName)) {
                showToast('Ім\'я та прізвище: рівно 2 слова, кожне з великої літери (наприклад, Іван Іванов)', 'warning');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Вхід...';

            try {
                var result = await auth.loginUser(email, password, fullName);

                // Якщо користувач забанений - loginUser зробить редірект на /banned
                if (result && result.banned === true) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Увійти';
                    return;
                }

                if (!result.success) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Увійти';
                    showToast(result.error, 'error');
                    return;
                }

                // auth.loginUser() вже робить редірект на /dashboard
                showToast('Ласкаво просимо до Typebiz!', 'success');

            } catch (error) {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Увійти';
                showToast('Помилка: ' + error.message, 'error');
            }
        });
    </script>
</body>
</html>

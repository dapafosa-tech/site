<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль — Typebiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        body {
            background: var(--gray-50);
            padding: 2rem;
        }

        .profile-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .profile-container .header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .profile-container .header .back {
            color: var(--primary);
            text-decoration: none;
        }

        .profile-container .header h1 {
            font-size: 1.5rem;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--gray-200);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--gray-500);
            margin: 0 auto 1.5rem;
            overflow: hidden;
            border: 3px solid var(--gray-300);
        }

        .profile-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-avatar-upload {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .profile-avatar-upload .btn-sm {
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
        }

        @media (max-width: 768px) {
            body {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="header">
            <a href="/dashboard" class="back"><i class="fas fa-arrow-left"></i></a>
            <h1>Мой профиль</h1>
        </div>

        <div class="profile-avatar" id="profileAvatar">
            <i class="fas fa-user"></i>
        </div>

        <div class="profile-avatar-upload">
            <button class="btn btn-sm btn-outline" onclick="document.getElementById('avatarInput').click()">
                <i class="fas fa-camera"></i> Сменить фото
            </button>
            <button class="btn btn-sm btn-danger" onclick="removeAvatar()">
                <i class="fas fa-trash"></i> Удалить
            </button>
            <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="uploadAvatar(event)">
        </div>

        <div id="profileInfo">
            <div class="form-group">
                <label class="form-label">Имя</label>
                <input type="text" class="form-control" id="fullName" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Роль</label>
                <input type="text" class="form-control" id="role" disabled>
            </div>
            <button class="btn btn-primary" onclick="window.location.href='/dashboard'">
                <i class="fas fa-arrow-left"></i> Назад
            </button>
        </div>
    </div>

    <script src="/js/db.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        let currentUser = null;

        (async function() {
            const isAuth = await auth.requireAuth();
            if (!isAuth) return;

            currentUser = auth.getCurrentUser();
            if (currentUser) {
                document.getElementById('fullName').value = currentUser.full_name || 'Не указано';
                document.getElementById('email').value = currentUser.email;
                document.getElementById('role').value = currentUser.role || 'user';
                
                // Показываем аватарку
                if (currentUser.avatar_url) {
                    document.getElementById('profileAvatar').innerHTML = `<img src="${currentUser.avatar_url}" alt="Avatar">`;
                } else {
                    document.getElementById('profileAvatar').innerHTML = `<i class="fas fa-user"></i>`;
                }
            }
        })();

        async function uploadAvatar(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                await showToast('Загрузка...', 'info');
                const url = await storage.uploadAvatar(file);
                
                // Обновляем аватарку на странице
                document.getElementById('profileAvatar').innerHTML = `<img src="${url}" alt="Avatar">`;
                await showToast('Аватарка обновлена!', 'success');
                
                // Обновляем данные пользователя
                currentUser.avatar_url = url;
                localStorage.setItem('userData', JSON.stringify(currentUser));
            } catch (error) {
                await showAlert('Ошибка: ' + error.message, 'error');
            }
        }

        async function removeAvatar() {
            const confirmed = await showConfirm('Вы уверены, что хотите удалить аватарку?', 'Подтверждение');
            if (!confirmed) return;

            try {
                await storage.deleteAvatar();
                document.getElementById('profileAvatar').innerHTML = `<i class="fas fa-user"></i>`;
                currentUser.avatar_url = null;
                localStorage.setItem('userData', JSON.stringify(currentUser));
                await showToast('Аватарка удалена', 'success');
            } catch (error) {
                await showAlert('Ошибка: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>

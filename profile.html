<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль — Typebiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #0F1115;
            --ink-soft: #171A21;
            --ink-line: #2A2E38;
            --gold: #F2A93B;
            --teal: #46C9B8;
            --text-onink: #E7E4DA;
            --muted: #8B93A6;
            --radius: 10px;
            --radius-sm: 6px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'IBM Plex Sans',sans-serif;
            background:var(--ink);
            color:var(--text-onink);
            min-height:100vh;
            padding:2rem;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .profile-container{
            max-width:600px;
            width:100%;
            background:var(--ink-soft);
            border:1px solid var(--ink-line);
            border-radius:var(--radius);
            padding:2rem;
            box-shadow:0 30px 60px rgba(0,0,0,0.5);
        }
        .header{
            display:flex;
            align-items:center;
            gap:1rem;
            margin-bottom:2rem;
        }
        .header .back{
            color:var(--teal);
            text-decoration:none;
            font-size:1.2rem;
        }
        .header .back:hover{color:var(--gold);}
        .header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;}
        .profile-avatar{
            width:120px;height:120px;
            border-radius:50%;
            background:var(--ink);
            border:2px solid var(--ink-line);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:3rem;
            color:var(--muted);
            margin:0 auto 1.5rem;
            overflow:hidden;
        }
        .profile-avatar img{width:100%;height:100%;object-fit:cover;}
        .profile-avatar-upload{
            text-align:center;
            margin-bottom:1.5rem;
            display:flex;
            gap:0.5rem;
            justify-content:center;
            flex-wrap:wrap;
        }
        .btn{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:0.5rem 1.2rem;
            border-radius:6px;
            font-weight:600;
            font-size:0.85rem;
            cursor:pointer;
            border:1px solid transparent;
            transition:transform .15s,box-shadow .15s;
        }
        .btn-outline{border-color:var(--ink-line);color:var(--text-onink);background:transparent;}
        .btn-outline:hover{border-color:var(--teal);color:var(--teal);}
        .btn-danger{background:#E2503E;color:white;}
        .btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(226,80,62,0.28);}
        .btn-gold{background:var(--gold);color:var(--ink);}
        .btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(242,169,59,0.28);}
        .btn-sm{padding:0.3rem 0.8rem;font-size:0.75rem;}
        .form-group{margin-bottom:1.5rem;}
        .form-label{display:block;font-weight:600;margin-bottom:0.4rem;font-size:0.85rem;}
        .form-control{
            width:100%;
            padding:0.75rem 1rem;
            background:var(--ink);
            border:1px solid var(--ink-line);
            border-radius:6px;
            color:var(--text-onink);
            font-family:'IBM Plex Sans',sans-serif;
            font-size:1rem;
        }
        .form-control:disabled{opacity:0.5;cursor:not-allowed;}
        #avatarInput{display:none;}
        @media(max-width:480px){
            body{padding:1rem;}
            .profile-container{padding:1.5rem;}
        }
    /* ==================== Загальні мобільні виправлення ==================== */
        @media (max-width: 768px) {
            table { display: block; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .modal-content { max-height: 85dvh; overflow-y: auto; }
            .form-control, select, textarea { font-size: 16px; }
            .card-header { flex-wrap: wrap; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <div class="header">
            <a href="/dashboard" class="back"><i class="fas fa-arrow-left"></i></a>
            <h1>Мій профіль</h1>
        </div>

        <div class="profile-avatar" id="profileAvatar">
            <i class="fas fa-user"></i>
        </div>

        <div class="profile-avatar-upload">
            <button class="btn btn-sm btn-outline" onclick="document.getElementById('avatarInput').click()">
                <i class="fas fa-camera"></i> Змінити фото
            </button>
            <button class="btn btn-sm btn-danger" onclick="removeAvatar()">
                <i class="fas fa-trash"></i> Видалити
            </button>
            <input type="file" id="avatarInput" accept="image/*" onchange="uploadAvatar(event)">
        </div>

        <div id="profileInfo">
            <div class="form-group">
                <label class="form-label">Ім'я</label>
                <input type="text" class="form-control" id="fullName" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" disabled>
            </div>
            <div class="form-group">
                <label class="form-label">Роль</label>
                <input type="text" class="form-control" id="role" disabled>
            </div>
            <button class="btn btn-gold" onclick="window.location.href='/dashboard'" style="width:100%;justify-content:center;">
                <i class="fas fa-arrow-left"></i> Назад
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/db.js"></script>
    <script src="/js/storage.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        var currentUser = null;

        (async function() {
            var isAuth = await auth.requireAuth();
            if (!isAuth) return;

            currentUser = auth.getCurrentUser();
            if (currentUser) {
                document.getElementById('fullName').value = currentUser.full_name || 'Не вказано';
                document.getElementById('email').value = currentUser.email;
                document.getElementById('role').value = currentUser.role || 'user';
                
                if (currentUser.avatar_url) {
                    document.getElementById('profileAvatar').innerHTML = '<img src="' + currentUser.avatar_url + '" alt="Аватар">';
                } else {
                    document.getElementById('profileAvatar').innerHTML = '<i class="fas fa-user"></i>';
                }
            }
        })();

        async function uploadAvatar(event) {
            var file = event.target.files[0];
            if (!file) return;

            try {
                await showToast('Завантаження...', 'info');
                var url = await storage.uploadAvatar(file);
                
                document.getElementById('profileAvatar').innerHTML = '<img src="' + url + '" alt="Аватар">';
                await showToast('Аватар оновлено!', 'success');
                
                currentUser.avatar_url = url;
                localStorage.setItem('userData', JSON.stringify(currentUser));
            } catch (error) {
                await showAlert('Помилка: ' + error.message, 'error');
            }
        }

        async function removeAvatar() {
            var confirmed = await showConfirm('Ви впевнені, що хочете видалити аватар?', 'Підтвердження');
            if (!confirmed) return;

            try {
                await storage.deleteAvatar();
                document.getElementById('profileAvatar').innerHTML = '<i class="fas fa-user"></i>';
                currentUser.avatar_url = null;
                localStorage.setItem('userData', JSON.stringify(currentUser));
                await showToast('Аватар видалено', 'success');
            } catch (error) {
                await showAlert('Помилка: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Налаштування — Typebiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --ink: #0F1115;
            --ink-soft: #171A21;
            --ink-line: #2A2E38;
            --gold: #F2A93B;
            --teal: #46C9B8;
            --text-onink: #E7E4DA;
            --muted: #8B93A6;
            --radius: 10px;
            --radius-sm: 6px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'IBM Plex Sans',sans-serif;
            background:var(--ink);
            color:var(--text-onink);
            min-height:100vh;
            padding:2rem;
            display:flex;
            align-items:center;
            justify-content:center;
        }
        .settings-container{
            max-width:600px;
            width:100%;
            background:var(--ink-soft);
            border:1px solid var(--ink-line);
            border-radius:var(--radius);
            padding:2rem;
            box-shadow:0 30px 60px rgba(0,0,0,0.5);
        }
        .header{
            display:flex;
            align-items:center;
            gap:1rem;
            margin-bottom:2rem;
        }
        .header .back{
            color:var(--teal);
            text-decoration:none;
            font-size:1.2rem;
        }
        .header .back:hover{color:var(--gold);}
        .header h1{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;}
        .avatar-section{display:flex;flex-direction:column;align-items:center;gap:0.75rem;margin-bottom:2.5rem;}
        .avatar-preview{
            position:relative;
            width:120px;height:120px;border-radius:50%;
            background:var(--ink);border:2px solid var(--ink-line);
            display:flex;align-items:center;justify-content:center;
            overflow:hidden;flex-shrink:0;font-size:2.4rem;font-weight:700;
            color:var(--gold);cursor:pointer;
            transition:border-color .2s;
        }
        .avatar-preview:hover{border-color:var(--gold);}
        .avatar-preview img{width:100%;height:100%;object-fit:cover;}
        .avatar-preview .overlay{
            position:absolute;inset:0;
            background:rgba(15,17,21,0.72);
            color:var(--text-onink);
            display:flex;flex-direction:column;align-items:center;justify-content:center;
            gap:0.25rem;font-size:0.75rem;font-weight:600;
            opacity:0;transition:opacity .2s;
            text-align:center;
        }
        .avatar-preview:hover .overlay,
        .avatar-preview.uploading .overlay{opacity:1;}
        .avatar-preview .overlay i{font-size:1.1rem;}
        .avatar-remove{
            position:absolute;top:-2px;right:-2px;
            width:26px;height:26px;border-radius:50%;
            background:#E2503E;color:#fff;
            display:flex;align-items:center;justify-content:center;
            font-size:0.7rem;border:2px solid var(--ink-soft);
            cursor:pointer;z-index:2;
        }
        .avatar-remove:hover{background:#c8402f;}
        .avatar-hint{font-size:0.8rem;color:var(--muted);}
        #avatarFileInput{display:none;}
        .form-group{margin-bottom:1.5rem;}
        .form-label{display:block;font-weight:600;margin-bottom:0.4rem;font-size:0.85rem;}
        .form-control{
            width:100%;
            padding:0.75rem 1rem;
            background:var(--ink);
            border:1px solid var(--ink-line);
            border-radius:6px;
            color:var(--text-onink);
            font-family:'IBM Plex Sans',sans-serif;
            font-size:1rem;
        }
        .form-control:focus{outline:none;border-color:var(--gold);}
        .btn{
            display:inline-flex;
            align-items:center;
            gap:8px;
            padding:0.6rem 1.5rem;
            border-radius:6px;
            font-weight:600;
            font-size:0.9rem;
            cursor:pointer;
            border:1px solid transparent;
            transition:transform .15s,box-shadow .15s;
        }
        .btn-gold{background:var(--gold);color:var(--ink);}
        .btn-gold:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(242,169,59,0.28);}
        .btn-danger{background:#E2503E;color:white;}
        .btn-danger:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(226,80,62,0.28);}
        .danger-zone{
            margin-top:2rem;
            padding-top:2rem;
            border-top:2px solid #E2503E;
        }
        .danger-zone h3{color:#E2503E;font-family:'Space Grotesk',sans-serif;}
        .danger-zone p{color:var(--muted);margin-bottom:1rem;}
        .flex{display:flex;gap:0.75rem;flex-wrap:wrap;margin-top:1rem;}
        @media(max-width:480px){
            body{padding:1rem;}
            .settings-container{padding:1.5rem;}
        }
    /* ==================== Загальні мобільні виправлення ==================== */
        @media (max-width: 768px) {
            table { display: block; width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
            .modal-content { max-height: 85dvh; overflow-y: auto; }
            .form-control, select, textarea { font-size: 16px; }
            .card-header { flex-wrap: wrap; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="settings-container">
        <div class="header">
            <a href="/dashboard" class="back"><i class="fas fa-arrow-left"></i></a>
            <h1>Налаштування</h1>
        </div>

        <div class="avatar-section">
            <div class="avatar-preview" id="avatarPreview" onclick="document.getElementById('avatarFileInput').click()">
                <span id="avatarInitial">U</span>
                <div class="overlay"><i class="fas fa-camera"></i>Змінити фото</div>
            </div>
            <input type="file" id="avatarFileInput" accept="image/*" onchange="handleAvatarChange(event)">
            <span class="avatar-hint">Натисніть на аватар, щоб змінити фото</span>
        </div>

        <form id="settingsForm">
            <div class="form-group">
                <label class="form-label">Ім'я</label>
                <input type="text" class="form-control" id="fullName" required>
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="form-group">
                <label class="form-label">Ваш ID <span style="font-weight:400;color:var(--muted);">(за ним вас можуть знайти для переписки)</span></label>
                <div style="display:flex;gap:0.5rem;">
                    <input type="text" class="form-control" id="userIdField" readonly disabled style="flex:1;font-family:monospace;font-size:0.85rem;opacity:0.85;cursor:default;">
                    <button type="button" class="btn btn-teal" id="copyIdBtn" onclick="copyUserId()" style="flex-shrink:0;">
                        <i class="fas fa-copy"></i> Копіювати
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-gold">
                <i class="fas fa-save"></i> Зберегти
            </button>
        </form>

        <div class="danger-zone">
            <h3><i class="fas fa-exclamation-triangle"></i> Небезпечна зона</h3>
            <p>Видалення акаунта призведе до втрати всіх даних</p>
            <button class="btn btn-danger" id="deleteBtn">
                <i class="fas fa-trash"></i> Видалити акаунт
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/js/db.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/ui.js"></script>
    <script src="/js/check-auth.js"></script>
    <script src="/js/storage.js"></script>
    <script>
        function renderAvatar(user) {
            var preview = document.getElementById('avatarPreview');
            var overlayHtml = '<div class="overlay"><i class="fas fa-camera"></i>Змінити фото</div>';
            if (user && user.avatar_url) {
                preview.innerHTML =
                    '<img src="' + user.avatar_url + '" alt="Аватар">' +
                    overlayHtml +
                    '<div class="avatar-remove" title="Видалити фото" onclick="handleAvatarRemove(event)"><i class="fas fa-times"></i></div>';
            } else {
                preview.innerHTML =
                    '<span id="avatarInitial">' + ((user && user.full_name ? user.full_name : 'U')[0].toUpperCase()) + '</span>' +
                    overlayHtml;
            }
        }

        async function handleAvatarChange(event) {
            var file = event.target.files[0];
            if (!file) return;

            var maxSizeBytes = 5 * 1024 * 1024;
            if (file.size > maxSizeBytes) {
                showToast('Файл занадто великий. Оберіть зображення до 5 МБ.', 'warning');
                event.target.value = '';
                return;
            }

            var preview = document.getElementById('avatarPreview');
            preview.classList.add('uploading');

            try {
                var url = await storage.uploadAvatar(file);
                renderAvatar(auth.getCurrentUser());
                showToast('Аватар оновлено!', 'success');
            } catch (error) {
                showToast('Помилка: ' + error.message, 'error');
            } finally {
                preview.classList.remove('uploading');
                event.target.value = '';
            }
        }

        async function handleAvatarRemove(event) {
            event.stopPropagation();
            var confirmed = await showConfirm('Видалити фото профілю?', 'Видалення аватара');
            if (!confirmed) return;

            try {
                await storage.deleteAvatar();
                renderAvatar(auth.getCurrentUser());
                showToast('Аватар видалено', 'success');
            } catch (error) {
                showToast('Помилка: ' + error.message, 'error');
            }
        }

        async function copyUserId() {
            var field = document.getElementById('userIdField');
            var id = field.value;
            if (!id) return;
            var btn = document.getElementById('copyIdBtn');
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(id);
                } else {
                    field.disabled = false;
                    field.select();
                    document.execCommand('copy');
                    field.disabled = true;
                }
                var originalHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Скопійовано';
                setTimeout(function() { btn.innerHTML = originalHtml; }, 1500);
            } catch (error) {
                showToast('Не вдалося скопіювати ID', 'error');
            }
        }

        (async function() {
            var isAuth = await auth.requireAuth();
            if (!isAuth) return;

            var user = auth.getCurrentUser();
            if (user) {
                document.getElementById('fullName').value = user.full_name || '';
                document.getElementById('email').value = user.email;
                document.getElementById('userIdField').value = user.id || '';
                renderAvatar(user);
            }

            document.getElementById('settingsForm').addEventListener('submit', async function(e) {
                e.preventDefault();

                var fullName = document.getElementById('fullName').value.trim();
                var email = document.getElementById('email').value.trim();
                var emailChanged = email !== user.email;
                var submitBtn = document.querySelector('#settingsForm button[type="submit"]');

                submitBtn.disabled = true;

                try {
                    // Ім'я оновлюємо одразу, без підтвердження.
                    if (fullName !== user.full_name) {
                        await db.updateUser(user.id, { full_name: fullName });
                        user.full_name = fullName;
                        localStorage.setItem('userData', JSON.stringify(user));
                    }

                    if (!emailChanged) {
                        await showToast('Налаштування збережено!', 'success');
                        submitBtn.disabled = false;
                        return;
                    }

                    // Email змінюється тільки через підтвердження кодом на нову пошту.
                    await auth.requestEmailChange(email);
                    submitBtn.disabled = false;
                    showToast('Код підтвердження надіслано на ' + email, 'success');
                    var confirmed = await showEmailChangeOtpModal(email);
                    if (confirmed) {
                        document.getElementById('email').value = email;
                        await showToast('Email успішно змінено!', 'success');
                    } else {
                        // Юзер скасував - повертаємо поле до старого значення.
                        document.getElementById('email').value = user.email;
                    }
                } catch (error) {
                    submitBtn.disabled = false;
                    await showAlert('Помилка: ' + error.message, 'error');
                }
            });

            // Модалка вводу 6-значного коду для підтвердження зміни email.
            function showEmailChangeOtpModal(newEmail) {
                return new Promise(function(resolve) {
                    var overlay = document.createElement('div');
                    overlay.className = 'modal-overlay';
                    overlay.style.cssText =
                        'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);' +
                        'backdrop-filter:blur(4px);z-index:999999;display:flex;align-items:center;justify-content:center;padding:1rem;';
                    overlay.innerHTML =
                        '<div style="background:var(--ink-soft);border:1px solid var(--ink-line);border-radius:12px;' +
                        'padding:2rem;max-width:420px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,0.6);">' +
                            '<div style="text-align:center;font-size:2.5rem;color:var(--gold);margin-bottom:1rem;"><i class="fas fa-envelope-circle-check"></i></div>' +
                            '<h3 style="text-align:center;font-size:1.15rem;font-weight:700;margin-bottom:0.5rem;">Підтвердження нової пошти</h3>' +
                            '<p style="text-align:center;color:var(--muted);margin-bottom:1.25rem;font-size:0.9rem;">Код надіслано на <strong>' + newEmail + '</strong>. Введіть 6-значний код з листа.</p>' +
                            '<input type="text" id="emailOtpInput" maxlength="6" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" style="width:100%;text-align:center;letter-spacing:0.5em;font-size:1.5rem;font-family:\'IBM Plex Mono\',monospace;padding:0.75rem 1rem;background:var(--ink);border:1px solid var(--ink-line);border-radius:6px;color:inherit;margin-bottom:0.75rem;">' +
                            '<div id="emailOtpMsg" style="text-align:center;font-size:0.8rem;color:var(--muted);margin-bottom:1rem;min-height:1.2em;"></div>' +
                            '<div style="display:flex;gap:0.75rem;">' +
                                '<button id="emailOtpCancel" type="button" class="btn" style="flex:1;background:transparent;border:1px solid var(--ink-line);color:inherit;">Скасувати</button>' +
                                '<button id="emailOtpSubmit" type="button" class="btn btn-gold" style="flex:2;">Підтвердити</button>' +
                            '</div>' +
                            '<div style="text-align:center;margin-top:1rem;"><a href="#" id="emailOtpResend" style="color:var(--teal);font-size:0.85rem;text-decoration:none;">Надіслати код повторно</a></div>' +
                        '</div>';
                    document.body.appendChild(overlay);

                    var input = overlay.querySelector('#emailOtpInput');
                    var msg = overlay.querySelector('#emailOtpMsg');
                    var submitBtn = overlay.querySelector('#emailOtpSubmit');
                    var cancelBtn = overlay.querySelector('#emailOtpCancel');
                    var resendLink = overlay.querySelector('#emailOtpResend');

                    setTimeout(function() { input.focus(); }, 50);
                    input.addEventListener('input', function() { input.value = input.value.replace(/\D/g, '').slice(0, 6); });

                    resendLink.addEventListener('click', async function(e) {
                        e.preventDefault();
                        try {
                            await auth.requestEmailChange(newEmail);
                            msg.style.color = 'var(--muted)';
                            msg.textContent = 'Код надіслано повторно.';
                        } catch (err) {
                            msg.style.color = '#E2503E';
                            msg.textContent = 'Помилка: ' + err.message;
                        }
                    });

                    async function trySubmit() {
                        var code = input.value.trim();
                        if (code.length !== 6) {
                            msg.style.color = '#E2503E';
                            msg.textContent = 'Введіть 6-значний код';
                            return;
                        }
                        submitBtn.disabled = true;
                        submitBtn.textContent = 'Перевірка...';
                        try {
                            await auth.verifyEmailChangeOtp(newEmail, code);
                            overlay.remove();
                            resolve(true);
                        } catch (err) {
                            msg.style.color = '#E2503E';
                            msg.textContent = err.message;
                            submitBtn.disabled = false;
                            submitBtn.textContent = 'Підтвердити';
                        }
                    }

                    submitBtn.addEventListener('click', trySubmit);
                    input.addEventListener('keydown', function(e) { if (e.key === 'Enter') trySubmit(); });
                    cancelBtn.addEventListener('click', function() { overlay.remove(); resolve(false); });
                });
            }

            document.getElementById('deleteBtn').addEventListener('click', async function() {
                var confirmed = await showConfirm('Ви впевнені, що хочете видалити акаунт? Це незворотна дія!', '⚠️ Увага');
                if (!confirmed) return;
                
                var confirmed2 = await showConfirm('Всі ваші дані будуть втрачені. Продовжити?', 'Останнє попередження');
                if (!confirmed2) return;

                try {
                    await db.deleteUser(user.id);
                    try { await window.sb.auth.signOut(); } catch (e) {}
                    localStorage.removeItem('userData');
                    localStorage.removeItem('isGuest');
                    await showToast('Акаунт видалено', 'success');
                    setTimeout(function() {
                        window.location.href = '/login';
                    }, 1500);
                } catch (error) {
                    await showAlert('Помилка: ' + error.message, 'error');
                }
            });
        })();
    </script>
</body>
</html>
